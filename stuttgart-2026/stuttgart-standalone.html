.alt{display:flex;align-items:center;gap:6px;position:sticky;top:-6px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);z-index:1}
.alt span{flex:1}
.amin{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:var(--line);color:var(--fg);font-size:1.1rem;font-weight:700;cursor:pointer}
.alist.vis{max-height:46%}
.arow.dn{opacity:.55}
.vday{display:flex;align-items:center;gap:8px;padding:10px 10px 2px;font-weight:800;font-size:.85rem}
.vday span{flex:1}
.vall{border:0;background:var(--accent-soft);color:var(--accent);border-radius:980px;padding:0 12px;min-height:32px;font-weight:700;font-size:.78rem;cursor:pointer}
.vrow{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;border:0;background:none;text-align:left;padding:2px 10px;border-radius:10px;color:var(--fg);font-size:.9rem;font-weight:500;cursor:pointer}
.vchk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:#fff}
.vrow.dn .vchk{background:#30a46c;border-color:#30a46c}
.vrow.dn>span:last-child{opacity:.6}
.abub{position:absolute;z-index:520;left:12px;bottom:12px;min-height:44px;padding:0 18px;border:0;border-radius:980px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--shadow);font-weight:800;font-size:.9rem;color:var(--fg);cursor:pointer}
.abub.top{background:#ffc400;color:#3d2b00}
#avbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.rtg{flex:none;align-self:center;font-size:.68rem;font-weight:700;padding:5px 10px;border-radius:12px;white-space:nowrap;cursor:pointer}
.r-m{background:rgba(255,138,0,.18);color:#c25e00}
.r-g{background:rgba(10,132,255,.16);color:#0a6fd6}
.r-o{background:rgba(128,128,128,.2);color:var(--muted)}
.rkey{font-size:.8rem;color:var(--muted);line-height:1.45;margin:6px 2px 10px}
.rkey b{font-weight:700}

.slegend{bottom:calc(var(--scar,0px) + 34px)}
.slegend svg{width:17px;height:17px}
.sbody{position:absolute;inset:0;z-index:540;overflow-y:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.sbody>*{max-width:640px;margin-left:auto;margin-right:auto}
.sbody[hidden]{display:none}
.tstar.sdone{background:#30a46c;color:#fff;top:-6px;right:-6px}
.rrate{display:flex;gap:6px;margin:10px 0 2px}
.rrate .rtg{flex:1;text-align:center;border:0;font:inherit;font-weight:700;font-size:.74rem;min-height:36px;opacity:.55}
.rrate .rtg[aria-pressed="true"]{opacity:1;box-shadow:inset 0 0 0 2px currentColor}
#sback{margin:4px 0 6px}

.foot{color:var(--muted);font-size:.8rem;margin-top:16px}
#hin{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);margin-top:4px}
.panel .status{color:var(--muted);font-size:.85rem;margin:6px 0 0}

function km(a,b){var r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 12742*Math.asin(Math.sqrt(x))}

  else{sh='<circle cx="20" cy="20" r="15" fill="#fff" stroke="'+c+'" stroke-width="4" stroke-dasharray="6 4"/>';tx=c}
  return '<svg viewBox="0 0 40 40" aria-hidden="true">'+sh+(lab?'<text x="20" y="'+ty+'" text-anchor="middle" font-size="'+fz+'" font-weight="700" fill="'+tx+'" font-family="-apple-system,Segoe UI,Roboto,sans-serif">'+lab+'</text>':'')+'</svg>'}
function shortName(n){return n.replace(/\s*\(.*?\)/g,"").replace(/ and .*$/,"").replace(/ & .*$/,"").replace(/ in the evening$/,"")}
function vis(s){return (fDay==="all"||s.day===fDay)&&(fRate==="all"||rateOf(s)===fRate)}
function sitInit(){
  if(smap||typeof L==="undefined")return;
  smap=L.map("map3",{zoomControl:false,attributionControl:true,zoomSnap:.5,tap:true}).setView([CENTER.lat,CENTER.lng],13);
  smap.attributionControl.setPrefix(false);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(smap);
  slayer=L.layerGroup().addTo(smap);smeLayer=L.layerGroup().addTo(smap);
  smap.on("click",function(){sitClose()});
  $("szin").addEventListener("click",function(){smap.zoomIn()});$("szout").addEventListener("click",function(){smap.zoomOut()})}
function sitDraw(fit){
  if(!smap)return;slayer.clearLayers();smeLayer.clearLayers();var pts=[];
  ALL.forEach(function(s){if(!vis(s))return;var r=rateOf(s),sel=ssel===s.id,dn=!!store.done[s.id],sz={m:40,g:30,o:22}[r]+(sel?10:0);pts.push([s.lat,s.lng]);
    var html='<div class="pinsvg'+(sel?' sel':'')+'">'+pinSVG(s,r)+(dn?'<b class="tstar sdone">✓</b>':'')+((sel||(r==="m"&&fDay!=="all"))?'<span class="pl">'+esc(shortName(s.n))+'</span>':'')+'</div>';
    var m=L.marker([s.lat,s.lng],{icon:pinIcon(html,sz),zIndexOffset:sel?1000:{m:300,g:200,o:100}[r],keyboard:false,title:s.n});
    m.on("click",function(e){if(e&&e.originalEvent)L.DomEvent.stopPropagation(e);sitCard(s)});m.addTo(slayer)});
  if(hasPin())L.marker([store.hotel.lat,store.hotel.lng],{icon:pinIcon('<div class="hpin">H</div>',30),zIndexOffset:500,title:"Hotel"}).addTo(slayer);
  if(hasMe()&&km(store.me,CENTER)<40)L.marker([store.me.lat,store.me.lng],{icon:pinIcon('<div class="medot"><i></i><span class="pl you">You</span></div>',28),zIndexOffset:2000,interactive:false}).addTo(smeLayer);
  if(fit&&pts.length)smap.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[36,150],paddingBottomRight:[36,70+(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--scar'))||0)+40],maxZoom:16,animate:false})}
function legTxt(s){var d=DAYS[s.day];if(s.x)return"Not on the main route";if(s.idx===0)return"Start: "+d.start;var p=d.stops[s.idx-1],k=walk(p,s);return(k>1.8?"Public transport · about "+Math.round(8+k*2.2)+" min":"Walk "+mins(k)+" min · "+fmtKm(k))+' · <a href="'+mapsDir(p,s,"transit")+'" target="_blank" rel="noopener">Directions ↗</a>'}
function sitCard(s){
  ssel=s.id;var box=$("scard"),r=rateOf(s),d=DAYS[s.day];
  var c=el("div","pc k-"+s.k+(store.done[s.id]?" done":""));
  c.innerHTML='<div class="pt"><span class="num k-'+s.k+(s.x?" x":"")+'">'+(s.x?"+":s.idx+1)+'</span><div><span class="tg">'+d.dow+' '+d.date.split(" ")[0]+' · '+(s.x?s.cat:KIND[s.k]+" · "+s.t)+'</span><span class="nm">'+esc(s.n)+'</span></div><button class="chk" aria-label="Visited" aria-pressed="'+(store.done[s.id]?"true":"false")+'">✓</button></div><span class="cs">'+esc(s.c)+'</span><p class="why">'+esc(s.why)+'</p><div class="leg2">'+legTxt(s)+'</div><div class="rrate"></div><div class="btnrow"><button class="btn solid wide" data-d="1">Details</button><a class="btn wide" href="'+mapsPlace(s)+'" target="_blank" rel="noopener">Maps ↗</a><button class="btn" data-x="1" aria-label="Close">✕</button></div>';
  var rr=c.querySelector(".rrate");["m","g","o"].forEach(function(k){var b=el("button","rtg r-"+k,RL[k]);b.setAttribute("aria-pressed",String(k===r));b.addEventListener("click",function(){store.rate[s.id]=k;save();renderSChips();sitCard(s);if(screen==="day")renderDay()});rr.appendChild(b)});
  c.querySelector(".chk").addEventListener("click",function(){store.done[s.id]=!store.done[s.id];save();sitDraw(false);sitCard(s);if(screen==="day")renderDay()});
  c.querySelector("[data-d]").addEventListener("click",function(){openDetail(s)});
  c.querySelector("[data-x]").addEventListener("click",function(){sitClose()});
  box.innerHTML="";box.appendChild(c);box.hidden=false;setScar(box.offsetHeight);
  sitDraw(false);smap.setView([s.lat,s.lng],Math.max(smap.getZoom(),15),{animate:true})}
function sitClose(quiet){var box=$("scard");if(box.hidden&&!quiet)return;box.hidden=true;box.innerHTML="";ssel=null;setScar(0);if(!quiet)sitDraw(false)}
function renderSChips(){
  var w=$("dchips");w.innerHTML="";
  [["all","Both days",null],[0,"Sun 25 Oct",null],[1,"Mon 26 Oct",null]].forEach(function(t){var b=el("button","achip"+(t[0]==="all"?" grp":""),t[1]);b.setAttribute("aria-pressed",String(fDay===t[0]));b.addEventListener("click",function(){fDay=t[0];if(t[0]!=="all"){cur=t[0];store.day=cur;save()}sitClose(true);renderSChips();sitDraw(true)});w.appendChild(b)});
  var w2=$("schips");w2.innerHTML="";var cnt={m:0,g:0,o:0},base=ALL.filter(function(s){return fDay==="all"||s.day===fDay});base.forEach(function(s){cnt[rateOf(s)]++});
  [["all","All "+base.length,null],["m","Must see "+cnt.m,RCOL.m],["g","Good "+cnt.g,RCOL.g],["o","Optional "+cnt.o,RCOL.o]].forEach(function(t){
    var b=el("button","achip"+(t[0]==="all"?" grp":""),(t[2]?'<i style="background:'+t[2]+'"></i>':'')+t[1]);b.setAttribute("aria-pressed",String(fRate===t[0]));
    b.addEventListener("click",function(){fRate=t[0];sitClose(true);renderSChips();sitDraw(true);if(screen==="day")renderDay()});w2.appendChild(b)})}
function renderSit(){
  sitInit();renderSChips();updLoc();
  requestAnimationFrame(function(){if(!smap)return;smap.invalidateSize();sitClose(true);sitDraw(true)})}
$("sfit").addEventListener("click",function(){if(smap){sitClose(true);sitDraw(true)}});
/* ---------- detail ---------- */
function fact(l,t){return t?'<div class="fact"><b>'+l+'</b><span>'+t+'</span></div>':''}
function openDetail(s){
  var f=s.f||{},d=DAYS[s.day],box=$("detail"),r=rateOf(s);
  var h='<div class="dbar k-'+s.k+'"><button class="rb" id="d-x" aria-label="Back">‹</button><div class="dt"><span class="tg">'+d.dow+' · '+(s.x?s.cat:KIND[s.k]+" · "+s.t)+'</span><span class="nm">'+esc(s.n)+'</span></div><button class="chk" id="d-chk" aria-label="Visited" aria-pressed="'+(store.done[s.id]?"true":"false")+'">✓</button></div><div class="dbody"><div class="card2"><div class="facts"><div><span class="rtg r-'+r+'">'+RL[r]+'</span></div><div><b style="font-size:1.1rem">'+esc(s.c)+'</b></div><div>'+esc(s.why)+'</div>';
  if(f.i)h+='<div class="fact"><b>Inside / what to see</b><ol class="ins">'+f.i.map(function(t){return"<li>"+t+"</li>"}).join("")+'</ol></div>';
  h+=fact("Time needed · best time",f.tm)+fact("Tickets & rules",f.tx)+fact("Nearby facilities",f.fa)+fact("Nearest station or stop",f.st)+fact("Local tip",f.tp);
  h+='<details class="kd"><summary>For kids</summary><p>'+esc(s.kid)+'</p></details></div>';
  h+='<div class="btnrow"><a class="btn solid wide" href="'+mapsPlace(s)+'" target="_blank" rel="noopener">Open in Maps ↗</a><button class="btn wide" id="d-map">Show on map</button></div>';
  if(hasMe())h+='<div class="btnrow"><a class="btn wide" href="'+mapsDir(store.me,s,"walking")+'" target="_blank" rel="noopener">Walk from me ↗</a><a class="btn wide" href="'+mapsDir(store.me,s,"transit")+'" target="_blank" rel="noopener">Transit from me ↗</a></div>';
  h+='</div></div>';
  box.innerHTML=h;box.hidden=false;box.scrollTop=0;
  $("d-x").addEventListener("click",closeDetail);
  $("d-chk").addEventListener("click",function(){var v=!store.done[s.id];store.done[s.id]=v;save();$("d-chk").setAttribute("aria-pressed",v?"true":"false");if(screen==="day")renderDay();else sitDraw(false)});
  $("d-map").addEventListener("click",function(){closeDetail();go("sit");setTimeout(function(){sitCard(s)},120)})}
function closeDetail(){$("detail").hidden=true}
/* ---------- plan (days) ---------- */
function renderChips(){var w=$("chips2");if(!w)return;w.innerHTML="";DAYS.forEach(function(d,i){var x=wxDay(i);var b=el("button",null,"<b>"+d.dow+" "+d.date.split(" ")[0]+"</b><small>"+(x?wxIcon(x.code)+" "+x.hi+"° · ":"")+d.area.split(",")[0]+"</small>");b.setAttribute("aria-pressed",i===cur?"true":"false");b.addEventListener("click",function(){cur=i;store.day=i;save();renderDay()});w.appendChild(b)})}
function renderDay(){
  var d=DAYS[cur],box=$("s-day"),w=wxDay(cur);
  var h=pageHead("Plan",d.dow+" "+d.date+" · "+d.area)+'<div class="chips" id="chips2"></div>';
  h+='<div class="hero"><h2>'+d.title+'</h2><p>'+d.lede+'</p><div class="stats"><div class="stat"><b>'+d.stops.length+'</b><span>main stops</span></div><div class="stat"><b>'+d.extras.length+'</b><span>extras</span></div><div class="stat"><b>'+d.budget+'</b><span>est. cost</span></div></div><div class="cstat">'+d.budgetNote+'. For 2 adults and 1 child.</div><div class="startline"><span class="k">Start</span><span>'+d.start+'</span></div></div>';
  h+='<div class="panel"><b class="t">Weather</b>';
  if(w)h+='<div>'+wxIcon(w.code)+' <b>'+w.hi+'° / '+w.lo+'°</b> · rain chance '+(w.pp==null?"n/a":w.pp+"%")+(w.sun?' · sunset '+w.sun:'')+'</div>'+(w.pp>=50?'<div class="hrow"><b>Rain likely.</b> See "If it rains" below.</div>':'');
  else h+='<div class="hrow">Not available here (needs internet access to the forecast service). <a href="https://www.google.com/search?q=weather+Stuttgart" target="_blank" rel="noopener">Open forecast ↗</a></div>';
  h+='</div>';
  h+='<div class="panel"><b class="t">Getting around</b><ul>'+d.getting.map(function(r){return"<li>"+r+"</li>"}).join("")+'</ul></div>';
  h+=hotelPanel(d);
  var cnt={m:0,g:0,o:0};d.stops.concat(d.extras).forEach(function(s){cnt[rateOf(s)]++});
  h+='<div class="sec"><h3>Rated places</h3><span>'+(d.stops.length+d.extras.length)+' places</span></div><div class="seg" id="rf" role="group" aria-label="Filter by rating"><button data-r="all">All</button><button data-r="m">Must see '+cnt.m+'</button><button data-r="g">Good '+cnt.g+'</button><button data-r="o">Optional '+cnt.o+'</button></div><div class="rkey"><b>Must see:</b> worth planning around. <b>Good to see:</b> nice if time allows. <b>Optional:</b> skip it and you miss nothing. Tap a tag on any place to change its rating.</div>';
  h+='<div class="sec"><h3>Main route</h3><span id="prog"></span></div><div class="bar"><i id="pbar"></i></div><div id="rows"></div>';
  h+='<div class="sec"><h3>More places</h3><span>'+d.extras.length+' places</span></div><div id="xrows"></div>';
  h+='<div class="panel rain"><b class="t">If it rains</b><ul>'+d.rain.map(function(r){return"<li>"+r+"</li>"}).join("")+'</ul></div>';
  h+='<details class="acc"><summary>For kids</summary><div class="c"><b>Facts</b><ul>'+d.facts.map(function(f){return"<li>"+f+"</li>"}).join("")+'</ul><b style="display:block;margin-top:10px">Spot list</b><ul class="spot" id="spot"></ul></div></details>';
  box.innerHTML=h;bindHotel();bindAa();renderChips();
  function prog(){var n=d.stops.filter(function(s){return store.done[s.id]}).length;$("prog").textContent=n+" of "+d.stops.length+" visited";$("pbar").style.width=(n/d.stops.length*100)+"%"}
  function ok(s){return fRate==="all"||rateOf(s)===fRate}
  function row(s,lab){var r=rateOf(s);var b=el("button","rowb k-"+s.k+(store.done[s.id]?" done":""),'<span class="num k-'+s.k+(s.x?" x":"")+'">'+lab+'</span><span class="rt"><b>'+esc(s.n)+'</b><small>'+(s.x?s.cat:KIND[s.k]+" · "+s.t)+' · '+esc(s.c)+'</small></span><span class="rtg r-'+r+'" role="button" tabindex="0">'+RL[r]+'</span>');
    b.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest(".rtg");if(t){e.stopPropagation();var o=["m","g","o"];store.rate[s.id]=o[(o.indexOf(rateOf(s))+1)%3];save();renderDay();renderSChips();sitDraw(false);return}openDetail(s)});return b}
  d.stops.forEach(function(s,i){if(ok(s))$("rows").appendChild(row(s,String(i+1)))});
  d.extras.forEach(function(s){if(ok(s))$("xrows").appendChild(row(s,"+"))});
  if(!$("rows").children.length)$("rows").innerHTML='<p class="cstat">No main-route places with this rating.</p>';
  if(!$("xrows").children.length)$("xrows").innerHTML='<p class="cstat">No more places with this rating.</p>';
  Array.prototype.forEach.call(box.querySelectorAll("#rf button"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-r")===fRate));b.addEventListener("click",function(){fRate=b.getAttribute("data-r");renderDay();renderSChips();sitDraw(true)})});
  prog();
  var sp=$("spot");d.spot.forEach(function(t,i){var key=d.id+"_"+i;var li=el("li",null,'<label><input type="checkbox"'+(store.spot[key]?" checked":"")+'> <span>'+t+'</span></label>');li.querySelector("input").addEventListener("change",function(e){store.spot[key]=e.target.checked;save()});sp.appendChild(li)})}
/* ---------- tips ---------- */
function acc(t,html){return '<details class="acc"><summary>'+t+'</summary><div class="c">'+html+'</div></details>'}
function renderTips(){
  var h=pageHead("Tips","General advice, listed once. Prices and hours for each place are on the Plan tab.");
  h+=acc("Deutschland-Ticket",'<ul><li><b>Covered:</b> S-Bahn, U-Bahn (Stadtbahn), city buses and regional trains (RB, RE, IRE) in all of Germany, including the whole Stuttgart VVS area. The Zacke rack railway and the Seilbahn are included.</li><li><b>Not covered:</b> ICE, IC and EC trains, Flixbus and taxis.</li><li><b>Personal ticket:</b> it is tied to one person. Show it on your phone when asked.</li><li><b>Children:</b> kids under 6 ride free. Children aged 6–14 need their own ticket on VVS: check vvs.de for the child day ticket.</li><li><b>Check each ride</b> in the DB Navigator or VVS app, and pick the filter "only regional".</li></ul>');
  h+=acc("Getting around Stuttgart",'<ul><li>The centre is compact: Hauptbahnhof, Schlossplatz, Altes Schloss and the Markthalle are within 10–15 min walking.</li><li>S-Bahn lines run to Bad Cannstatt, the Mercedes museum (S1) and Porsche (S6 / S60). U-Bahn lines run to the Wilhelma, the Fernsehturm and the south.</li><li>Stuttgart is hilly: expect stairs (Stäffele) and some uphill walks to the viewpoints.</li><li>Stuttgart has a green low-emission zone: do not drive into the centre.</li></ul>');
  h+=acc("Sunday and Monday closures",'<ul><li><b>Sunday:</b> shops and the Markthalle are closed. Museums, the zoo and restaurants are open.</li><li><b>Monday:</b> most museums are closed (Mercedes-Benz, Porsche, Staatsgalerie, Landesmuseum, Kunstmuseum and others). The Markthalle, churches, parks and the Fernsehturm are open.</li><li>Always check the opening hours on the day, hours change in autumn.</li></ul>');
  h+=acc("Food",'<ul><li>Try <b>Maultaschen</b> (filled pasta), <b>Spätzle</b> (egg noodles), <b>Linsen mit Spätzle und Saitenwürstle</b> (lentils), <b>Flammkuchen</b> and <b>Brezeln</b>.</li><li>Many places take only cards or only cash, so carry a little of both.</li><li>Tap water is safe to drink. Restaurants may charge for tap water.</li></ul>');
  h+=acc("Safety",'<ul><li>Stuttgart is safe. Keep bags closed around the station and in crowds.</li><li>Dark paths in parks (Karlshöhe, Rosensteinpark) after 17:30: stay on lit routes.</li><li>Emergency: <b>112</b> (fire and ambulance), <b>110</b> (police).</li></ul>');
  h+=acc("Weather and clothes",'<ul><li>Late October is cool: around 6–14 °C. Rain is possible. Bring a jacket, layers, and a small umbrella.</li><li>Sunset is about 17:05–17:10 after the clock change. Plan viewpoints before 16:30.</li></ul>');
  h+=acc("Useful German",'<ul><li>Hallo / Guten Tag: hello</li><li>Danke / Bitte: thanks / please</li><li>Eine Tageskarte für ein Kind, bitte: a day ticket for one child, please</li><li>Wo ist die Haltestelle? Where is the stop?</li><li>Die Rechnung, bitte: the bill, please</li></ul>');
  h+='<p class="foot">Ticks, hotel, location and text size are saved on this device only.</p>';
  $("s-tips").innerHTML=h;bindAa()}
/* ---------- navigation ---------- */
function go(s){screen=s;["sit","day","tips"].forEach(function(n){$("s-"+n).hidden=n!==s});
  document.body.classList.toggle("plan",s==="sit");
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabbar button"),function(b){if(b.getAttribute("data-s")===s)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  closeDetail();closeMenus();window.scrollTo({top:0});
  if(s==="sit")renderSit();if(s==="day")renderDay();if(s==="tips")renderTips()}
Array.prototype.forEach.call(document.querySelectorAll("nav.tabbar button"),function(b){b.addEventListener("click",function(){go(b.getAttribute("data-s"))})});
bindAa();
var h0=location.hash.replace("#","");go(["day","tips"].indexOf(h0)>-1?h0:"sit");
loadWx();
})();

</script>
</body></html>
