.alt{display:flex;align-items:center;gap:6px;position:sticky;top:-6px;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);z-index:1}
.alt span{flex:1}
.amin{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:var(--line);color:var(--fg);font-size:1.1rem;font-weight:700;cursor:pointer}
.alist.vis{max-height:46%}
.arow.dn{opacity:.55}
.vday{display:flex;align-items:center;gap:8px;padding:10px 10px 2px;font-weight:800;font-size:.85rem}
.vday span{flex:1}
.vall{border:0;background:var(--accent-soft);color:var(--accent);border-radius:980px;padding:0 12px;min-height:32px;font-weight:700;font-size:.78rem;cursor:pointer}
.vrow{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;border:0;background:none;text-align:left;padding:2px 10px;border-radius:10px;color:var(--fg);font-size:.9rem;font-weight:500;cursor:pointer}
.vchk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:#fff}
.vrow.dn .vchk{background:#30a46c;border-color:#30a46c}
.vrow.dn>span:last-child{opacity:.6}
.abub{position:absolute;z-index:520;left:12px;bottom:12px;min-height:44px;padding:0 18px;border:0;border-radius:980px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--shadow);font-weight:800;font-size:.9rem;color:var(--fg);cursor:pointer}
.abub.top{background:#ffc400;color:#3d2b00}
#avbtn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.rtg{flex:none;align-self:center;font-size:.68rem;font-weight:700;padding:5px 10px;border-radius:12px;white-space:nowrap;cursor:pointer}
.r-m{background:rgba(255,138,0,.18);color:#c25e00}
.r-g{background:rgba(10,132,255,.16);color:#0a6fd6}
.r-o{background:rgba(128,128,128,.2);color:var(--muted)}
.rkey{font-size:.8rem;color:var(--muted);line-height:1.45;margin:6px 2px 10px}
.rkey b{font-weight:700}

.slegend{bottom:calc(var(--scar,0px) + 34px)}
.slegend svg{width:17px;height:17px}
.sbody{position:absolute;inset:0;z-index:540;overflow-y:auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) max(18px,env(safe-area-inset-right,0px)) 40px max(18px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.sbody>*{max-width:640px;margin-left:auto;margin-right:auto}
.sbody[hidden]{display:none}
.tstar.sdone{background:#30a46c;color:#fff;top:-6px;right:-6px}
.rrate{display:flex;gap:6px;margin:10px 0 2px}
.rrate .rtg{flex:1;text-align:center;border:0;font:inherit;font-weight:700;font-size:.74rem;min-height:36px;opacity:.55}
.rrate .rtg[aria-pressed="true"]{opacity:1;box-shadow:inset 0 0 0 2px currentColor}
#sback{margin:4px 0 6px}

.foot{color:var(--muted);font-size:.8rem;margin-top:16px}
#hin{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);margin-top:4px}
.panel .status{color:var(--muted);font-size:.85rem;margin:6px 0 0}

{id:"d2",dow:"Sun",date:"29 Nov",title:"Family day at the Deutsches Museum",area:"Munich, Isar and Old Town",cy:"Munich",wxi:0,hc:"munich",sleep:"Munich",

 clim:"Typical: about 0 to 5 °C, mostly cloudy. Sunset around 16:20.",

 getting:["Hauptbahnhof to the Deutsches Museum: S-Bahn to Isartor, then 10 min on foot along the Isar, or tram 16 to the museum.","Everything else is walkable. Use the S-Bahn or U-Bahn only if the kids are tired.","Sunday: most shops are closed (Germany). Museums, restaurants and Christmas markets are open.","A day ticket for the whole city is usually cheaper than single tickets: ask for a Partner/Group day ticket at the machine."],

 spot:["Find the big aeroplanes in the aviation hall","Look for the model mine under the ground floor","Spot swans or ducks on the Isar","Find a Christmas market stall selling candles"],
 wrule:"Good bad-weather day. Mountain day (Day 3) is the one that needs clear weather: if Monday is stormy, swap it with a Munich indoor day.",
 stops:[
 S("b1","Deutsches Museum",48.12990,11.58340,"play","09:30","≈€15 adult · ≈€8 child 6–15","m","A giant hands-on museum: planes, ships, mines, music and physics demos. The Kids’ Kingdom is good for your 6-year-old, the physics and space halls for your 12-year-old.","Find the aeroplanes and the ship exhibits.",
   {i:["Aviation hall with real aircraft","Shipping and the big model mine","Physics and space exhibitions","Kids’ Kingdom (ages 3–8)","Demonstrations (check the daily times)"],tm:"3–4 h with lunch.",tx:"Open daily about 09:00–17:00. Prices change: check deutsches-museum.de. Children under 6 are free.",fa:"Cafés, a restaurant, toilets, lockers, lifts.",st:"Tram 16 or S-Bahn to Isartor then 10 min walk. Museumsinsel stop.",tp:"Choose 3 halls only: it is too big to see everything. Eat at the museum café to save time."}),
 S("b2","Isar river walk and Isartor",48.13440,11.58200,"view","14:15","Free","g","A short riverside walk from the museum to the old Isartor gate. Fresh air after the museum.","Spot the old gate with painted frescoes.",
   {i:["Isar river path","Isartor gate with a painted frieze","View back to the museum island"],tm:"30–45 min.",tx:"Free.",fa:"Cafés near Isartor.",st:"Isartor: S-Bahn lines.",tp:"A good moment for a warm drink."}),

   {i:["Feldherrnhalle with two lion statues","Theatinerkirche, a yellow baroque church","Hofgarten (court garden)","Residenz palace walls"],tm:"30–45 min.",tx:"Free. Church interiors are free but closed during services.",fa:"Cafés around the square.",st:"Odeonsplatz: U3, U4, U5, U6.",tp:"The Residenz museum is open Sunday afternoons but closes at 17:00: only if you have energy."}),

{id:"d3",dow:"Mon",date:"30 Nov",title:"Zugspitze: snow, cable cars and the Eibsee",area:"Bavarian Alps, Zugspitze",cy:"Garmisch-Partenkirchen",wxi:0,hc:"munich",sleep:"Munich",
 start:"Munich Hauptbahnhof, regional train to Garmisch-Partenkirchen (about 1 h 25 min)",startPt:{n:"Munich Hauptbahnhof",lat:48.1403,lng:11.5600},
 budget:"€330",budgetNote:"Zugspitze round trip ≈€70 adult and ≈€40 child 6–17 (check zugspitze.de; under 6 free) · regional train ≈€40–60 for the group · food ≈€60",
 clim:"Munich side: about 0 to 4 °C. On the summit: very cold, about −8 to −15 °C with wind. Sunset around 16:20.",
 lede:"Your big Bavarian snow day. Take the train to Garmisch, ride the rack railway and cable cars to Germany’s highest peak (2,962 m), and come back down past the Eibsee lake. Start early: it is dark by 16:30.",
 getting:["Munich to Garmisch: regional train about 1 h 25 min, usually hourly. A Bayern-Ticket (regional day pass for a small group, valid from 09:00 on weekdays; children under 15 often free with parents) is usually cheapest: check bahn.de.","Garmisch: the Zugspitzbahn rack railway leaves from the Zugspitzbahnhof next to the main station and goes to the glacier plateau (about 75 min), then a cable car to the summit.","Coming down: the Eibsee cable car (about 10 min) lands at the lake. From Eibsee a train runs back to Garmisch (about 35 min).","Buy the all-in round trip. Last descents are around 16:00–16:30 in winter: be on your way down by 15:30."],
 rain:["Cloud or storm on the summit: skip it. See the weather rule below.","Bad-weather option: Neuschwanstein tour (Füssen) or back to Munich’s Deutsches Museum / BMW Welt.","If the mountain is clear but cold, the Eibsee walk is still pretty."],
 facts:["The Zugspitze is Germany’s highest mountain at 2,962 m. The summit is on the border with Austria.","The Eibsee cable car climbs about 1,900 m in 10 minutes.","The Eibsee is a lake at about 1,000 m with water that looks green and clear, and small forested islands."],
 spot:["Find the border line between Germany and Austria on the summit","Make a snowman or a snow angel on the plateau","Spot the emerald water of the Eibsee","Count the cable car cabins you pass"],
 wrule:"Mountain day. Check the Zugspitze webcam and lift status on zugspitze.de in the morning. If the summit is in cloud or the lifts are closed, swap this day with a Munich city day (Day 2) or use the Neuschwanstein alternative below.",
 stops:[
 S("c1","Garmisch-Partenkirchen and the Zugspitzbahnhof",47.49080,11.09620,"see","10:35","Train ≈ part of the day ticket","o","The alpine town below the mountain. The rack railway station is right next to the main train station.","Look for the painted house fronts.",
   {i:["Main station and the Zugspitzbahnhof next door","Painted houses in the old town","Cafés for a warm start"],tm:"20–30 min before boarding.",tx:"Buy or show your Zugspitze tickets at the Zugspitzbahn desk.",fa:"Toilets and cafés at the station.",st:"Garmisch-Partenkirchen Hbf; the Zugspitzbahnhof is a 1-min walk.",tp:"Buy snacks and water here: mountain prices are high.",lg:"Train from Munich Hbf about 1 h 25 min · leave around 09:00"}),
 S("c2","Zugspitzplatt: the glacier plateau",47.41570,10.98080,"play","12:15","Included in the all-in ticket","m","A wide snow plateau at about 2,600 m reached by the rack railway. A hut and snow to play in.","Throw the first snowball and look for ski runs.",
   {i:["Snow plateau and mountain hut","Sonn-Alpin restaurant","Views of the surrounding peaks","Changing from rack railway to the summit cable car"],tm:"45–60 min including lunch.",tx:"Open in winter; some snow-play areas and the sledding track may vary by season: check zugspitze.de.",fa:"Restaurant, toilets, warm room.",st:"Rack railway to Zugspitzplatt.",tp:"Eat here, not at the summit, if you want a calmer lunch.",lg:"Rack railway from Garmisch about 75 min"}),
 S("c3","Zugspitze summit (2,962 m)",47.42110,10.98520,"view","13:30","Included in the all-in ticket","m","The top of Germany: a viewing platform, a golden cross, and a view over four countries on a clear day.","Stand in two countries at the same time.",
   {i:["Viewing platform and golden summit cross","Münchner Haus hut and Austrian terrace","Border between Germany and Austria","Gletscherbahn cable car ride up"],tm:"1–1.5 h.",tx:"Open daily in winter with the cable cars. Wear warm layers: strong wind.",fa:"Restaurants, toilets, shops.",st:"Gletscherbahn from Zugspitzplatt.",tp:"A 6-year-old might get cold fast: bring a neck warmer, spare gloves and a hot drink.",lg:"Gletscherbahn cable car from the plateau about 4 min"}),
 S("c4","Eibsee lake",47.45690,10.99450,"view","15:30","Free","g","Go down by the Eibsee cable car and finish at the lake. A short shore walk with the mountain behind.","Look for the tiny forested islands.",
   {cy:"Eibsee",i:["Eibsee cable car down","Lakeside path (shortest loop part)","Eibsee station: train back to Garmisch","Eibsee hotel and café"],tm:"45–60 min.",tx:"Free. The cable car has a maintenance break some weeks in autumn: check zugspitze.de before the day.",fa:"Café, toilets, shop.",st:"Eibsee station on the rack line; return train to Garmisch about 35 min.",tp:"Take a Garmisch train that links to your Munich train (leave by 17:30 at the latest).",lg:"Eibsee cable car about 10 min"}),
 ],
 extras:[

{id:"d4",dow:"Tue",date:"1 Dec",title:"Train to Salzburg and the old town at dusk",area:"Salzburg, Old Town",cy:"Salzburg",wxi:1,hc:"munich",sleep:"Salzburg (near Mirabellplatz or the Hauptbahnhof)",
 start:"Munich Hauptbahnhof, direct train to Salzburg Hbf (about 1 h 30–1 h 45)",startPt:{n:"Munich Hauptbahnhof",lat:48.1403,lng:11.5600},

{id:"d5",dow:"Wed",date:"2 Dec",title:"Fortress, nature museum and hot chocolate",area:"Salzburg, Old Town and fortress",cy:"Salzburg",wxi:1,hc:"salzburg",sleep:"Salzburg",
 start:"Your hotel in Salzburg, walk to the Festungsbahn funicular at Kapitelplatz (about 20 min)",startPt:{n:"Salzburg Hauptbahnhof",lat:47.8130,lng:13.0457},

 clim:"Typical: about −3 to 3 °C. Sunset around 16:20: go up to the fortress in the morning.",
 lede:"A relaxed Salzburg day: the fortress with its funicular for views and rooms, then a family favourite museum, a warm café, and a last look at the lit-up old town.",
 getting:["The Festungsbahn funicular leaves from Kapitelplatz and takes about 1 minute up the hill. Buy the combined fortress + funicular ticket.","The old town, Haus der Natur and Mirabell are all within 10–15 min walking of each other.","A local bus runs from the Hbf to the old town if the kids are tired.","Salzburg Card (24 h or more) can include the fortress, funicular and Haus der Natur: compare with single tickets."],

 facts:["Hohensalzburg Fortress dates from 1077 and is one of the biggest fully preserved castles in Europe.","The Festungsbahn funicular opened in 1892 and is one of the oldest in Austria.","Haus der Natur has an aquarium, a reptile zoo and a space hall."],
 spot:["Find the fortress from three different places in the city","Spot a shark or a crocodile in Haus der Natur","Count the church towers from the fortress terrace","Taste Salzburger Nockerl or a hot chocolate"],
 wrule:"Clear weather is best for the fortress views. If Day 6 (Kitzsteinhorn) looks cloudy and today is clear, swap Day 5 and Day 6.",
 stops:[
 S("e1","Hohensalzburg Fortress and the Festungsbahn",47.79500,13.04770,"play","09:45","Funicular + fortress ≈€17–20 adult (check) · child about half","m","The big medieval fortress above the city. Ride the funicular, walk the terraces for views and visit the small museums.","Look for the long Hohensalzburg walls and find the oldest cannon.",
   {i:["Funicular ride from Kapitelplatz","View terraces over the city and the Alps","Fortress museums and the Marionette museum","Café and shop inside"],tm:"2–2.5 h.",tx:"Open daily in winter, about 09:30–17:00. Tickets by the funicular: check festung-hohensalzburg.at. Audio guide available in English.",fa:"Cafés, toilets, lifts in part of the fortress.",st:"Kapitelplatz (Festungsbahn valley station).",tp:"Go early for clear views and fewer people. Part of the fortress is cobbled and uphill.",lg:"Walk from the hotel about 20 min to Kapitelplatz"}),

   {i:["Peterskirchhof cemetery with cave chapels","Church of St. Peter","The bakery and café in the old courtyard"],tm:"30–40 min.",tx:"Cemetery free. Catacombs have a small fee and tours at set times (check).",fa:"Toilets at the nearby café.",st:"Old town on foot.",tp:"Lunch at a simple café on the way."}),

   {i:["Aquarium with sharks and reef fish","Reptile zoo","Space hall and science centre","Dinosaurs and Alpine nature"],tm:"2–2.5 h.",tx:"Open daily about 09:00–17:00. Check hausdernatur.at for current prices and opening.",fa:"Café, toilets, lockers.",st:"Museumsplatz, a 10 min walk from the Getreidegasse.",tp:"The 12-year-old will like the space and science floors."}),

{id:"d6",dow:"Thu",date:"3 Dec",title:"Kitzsteinhorn: snow, glacier and cable cars",area:"Kaprun, Kitzsteinhorn",cy:"Kaprun",wxi:1,hc:"salzburg",sleep:"Salzburg",
 start:"Salzburg Hbf, train to Zell am See, then bus to Kaprun and the Kitzsteinhorn valley station",startPt:{n:"Salzburg Hauptbahnhof",lat:47.8130,lng:13.0457},
 budget:"€320",budgetNote:"Top of Salzburg / Gipfelwelt 3000 ticket about €60–70 per adult and less for children (check kitzsteinhorn.at) · train and bus ≈€60–100 for four · food ≈€60",
 clim:"Salzburg: about −3 to 3 °C. Summit at 3,000 m: very cold, around −10 to −15 °C with wind. Sunset around 16:25.",
 lede:"The main high-Alpine snow experience of the trip. Cross by train to Zell am See, then ride the cable cars up the Kitzsteinhorn glacier to the ‘Top of Salzburg’ at 3,029 m. Move this day to the clearest weather in the week.",
 getting:["Salzburg Hbf to Zell am See: direct train, about 1 h 20–1 h 40 (book seats). Check oebb.at.","Zell am See to Kaprun and the Kitzsteinhorn valley station: regional bus (about 25–40 min). Buses are linked to winter ski traffic: check the timetable on the ÖBB app.","Gletscherbahn cable cars go from the valley station up the glacier to the Gipfelwelt 3000 platform. Last descent is around 16:00–16:30: leave the top by 15:00.","Return to Salzburg in the late afternoon: the last trains are fine, but darkness falls at 16:30."],
 rain:["If the summit is in cloud or the lifts are closed, skip the glacier. Do Salzburg city (Day 5 plan) instead.","Zell am See’s old town and the lake promenade are a gentle plan B.","Nothing here is an indoor day: keep this the one day that can move."],
 facts:["The Kitzsteinhorn is 3,203 m high. The Gipfelwelt 3000 viewing platform sits at 3,029 m and is called ‘Top of Salzburg’.","From the platform you can see over 30 peaks above 3,000 m, including the Grossglockner, Austria’s highest mountain.","Zell am See is a town on a lake that freezes at the edges in winter."],
 spot:["Find the Grossglockner on the panorama board","Spot a skier or a snowboarder from the cable car","Make a snow angel on the glacier","Count the cable car stations you pass"],
 wrule:"Mountain day. Look at the Kitzsteinhorn webcam and lift status in the morning (kitzsteinhorn.at). If the top is in cloud, swap with Day 5 (Salzburg city) or Day 7 (Hallstatt) when those days have better visibility.",
 stops:[
 S("f1","Zell am See",47.32500,12.79600,"see","09:15","Free","o","A small town on a lake in the Alps. Take a few minutes to see the water and the mountains before heading to the glacier.","Spot the big lake and the snow-capped mountains.",
   {cy:"Zell am See",i:["Station and lake promenade","Old town streets","Views of the Schmittenhöhe mountain"],tm:"20–30 min or a longer stop on the way back.",tx:"Free.",fa:"Cafés and toilets at the station and in town.",st:"Zell am See Bahnhof. Bus to Kaprun leaves near the station.",tp:"Buy water and snacks here.",lg:"Train from Salzburg Hbf about 1 h 20–1 h 40"}),
 S("f2","Kaprun village",47.27230,12.76370,"eat","10:00","Snacks ≈€8–12 per person","g","A small ski village with a medieval castle and cafés. A last stop for food before the mountain.","Look for the little castle on the hill.",
   {i:["Village centre","Kaprun Castle on the hill","Cafés and bakeries"],tm:"20–30 min.",tx:"Free.",fa:"Cafés, toilets, shops.",st:"Bus from Zell am See to Kaprun (Ortszentrum).",tp:"The Kitzsteinhorn bus may skip the village: check the timetable.",lg:"Bus from Zell am See about 15–25 min"}),
 S("f3","Kitzsteinhorn valley station (Gletscherbahn)",47.25820,12.73200,"play","10:45","Ticket ≈€60–70 adult (check) · less for kids","m","Where the glacier cable cars start. Buy the Gipfelwelt 3000 ticket here and ride up through the valley and onto the ice.","Ride the big cable car and watch the valley shrink.",
   {cy:"Kaprun",i:["Gletscherbahn cable cars","Mid-station views","Ski and snowboard areas at the glacier"],tm:"About 30–40 min of riding in total.",tx:"Open daily in the winter season. Prices change: check kitzsteinhorn.at. Children’s tickets depend on age; under 6 are often free, your 6-year-old may need a child ticket.",fa:"Restaurants, toilets and lockers at the valley station.",st:"Kitzsteinhorn Gletscherbahn stop (bus).",tp:"Rent nothing: you are not skiing. Wear boots, sunglasses and sunscreen.",lg:"Bus from Kaprun about 10–15 min"}),
 S("f4","Gipfelwelt 3000: Top of Salzburg",47.19680,12.69340,"view","12:00","Included in the cable car ticket","m","A viewing platform at 3,029 m with a panorama of 30 peaks, an ice cave and an exhibition about the glacier.","Look for the Grossglockner and find a spot with no wind.",
   {i:["Viewing platform at 3,029 m","Panorama board with named peaks","Ice palace / glacier exhibition (check)","Mountain restaurant"],tm:"1.5–2 h at the top.",tx:"Open daily in winter with the cable cars. Strong wind and cold: bring layers and neck warmers.",fa:"Restaurant, toilets, shop.",st:"Top of the Gletscherbahn.",tp:"Altitude can make kids tired or give a headache: drink water, walk slowly, and go down if needed."}),
 S("f5","Alpincenter and the glacier restaurants",47.21330,12.72060,"eat","14:00","Lunch ≈€60 for four","g","A mid-station with restaurants, snow slopes and a calm place for lunch before heading down.","Share a big bowl of Kaiserschmarrn (shredded pancake).",
   {i:["Self-service restaurants","Terrace with snow views","Snow play area (check)"],tm:"1 h.",tx:"Open with the cable cars. Prices at the glacier are high: bring snacks.",fa:"Toilets, lockers.",st:"Mid-station on the Gletscherbahn.",tp:"Be on the last descent by 15:30–16:00."}),
 ],
 extras:[
 X("fx-zell","Zell am See lake promenade",47.32530,12.80000,"view","Walk","Free","o","A short evening walk on the lake after the mountain.","Look for ducks and swans near the shore.",
   {i:["Lake promenade","Town centre and cafés"],tm:"30–45 min.",tx:"Free.",fa:"Cafés and toilets.",st:"Zell am See station, 10 min walk.",tp:"Only if your train back is not too tight."}),
 X("fx-schmitten","Schmittenhöhe cable car (Zell am See)",47.32370,12.79860,"view","Cable car","≈€30 adult (check)","o","A lower-altitude cable car with views of the lake and the Alps. A cheaper alternative to the glacier.","Spot the lake from above.",
   {i:["Cable car ride","Mountain walks and views"],tm:"2–3 h.",tx:"Winter ski area: paths may be icy. Check schmitten.at.",fa:"Restaurants, toilets.",st:"Zell am See Schmittenhöhebahn, a 15 min walk from the station.",tp:"A good backup if the glacier is in cloud."}),
 X("fx-burg","Kaprun Castle",47.26930,12.75610,"see","Viewpoint","Free (outside)","o","A small castle above the village, mostly seen from outside.","Take a photo of the castle with snow.",
   {i:["Castle from outside","Village views"],tm:"20 min.",tx:"Interior mostly closed in winter.",fa:"Cafés in the village.",st:"Kaprun village.",tp:"Skip if you are short on time."}),
 ]
},
{id:"d7",dow:"Fri",date:"4 Dec",title:"Hallstatt: the lake village",area:"Hallstatt, Salzkammergut",cy:"Hallstatt",wxi:1,hc:"salzburg",sleep:"Salzburg",
 start:"Salzburg Hbf, train via Attnang-Puchheim to Hallstatt station, then the ferry across the lake",startPt:{n:"Salzburg Hauptbahnhof",lat:47.8130,lng:13.0457},
 budget:"€230",budgetNote:"Train and ferry for four about €80–120 (check oebb.at) · salt mine tour and funicular ≈€100 for the family (check salzwelten.at) · food ≈€50",
 clim:"Typical: about −3 to 3 °C, often foggy or low cloud on the lake. Sunset around 16:15.",
 lede:"A classic Austrian lake-and-mountain village without changing hotels. The trip takes about 2.5 hours each way by train and ferry, so make it a full day.",
 getting:["Salzburg to Hallstatt: usually train to Attnang-Puchheim, change to the Salzkammergut line, get off at Hallstatt station. The ferry crosses the lake to the village and is timed to meet trains. About 2.5–3 h in total: check oebb.at and the ÖBB app.","Another route: train or bus to Bad Ischl, then local bus to Hallstatt.","The salt mine funicular (Salzbergbahn) goes from the village up to the Salzwelten and the Skywalk. Check opening and tours for winter.","Last return trains in winter are early evening: plan to leave the village by about 16:30."],
 rain:["The salt mine tour (Salzwelten) is partly underground: good in rain.","The Hallstatt Museum and cafés in the market square are dry options.","In fog the Skywalk shows nothing: keep it flexible and go on a clearer day if you can swap."],
 facts:["Hallstatt is a UNESCO World Heritage village. The salt mine above it is among the oldest in the world.","A copy of Hallstatt was built in China, in a village called Luoyuan.","The miners’ slides in the Salzwelten tour are real wooden slides used by workers to go down quickly."],
 spot:["Take the ferry across the lake","Find the old Lutheran church tower","Ride a miner’s slide (if on the tour)","Spot swans on the lake"],
 wrule:"Hallstatt works in most weather but is best in clear light: if Thursday’s Kaprun is cloudy, swap Day 6 and Day 7 and go to the lake on the clearer day.",
 stops:[
 S("g1","Hallstatt station and the ferry",47.56120,13.64090,"play","10:45","Ferry ≈€3–4 per adult (check)","g","A small station on the opposite shore of the lake. The ferry ride is the best arrival: you see the village from the water.","Count the swans and look for the village appearing.",
   {i:["Hallstatt Bahnhof","Short ferry ride across the Hallstätter See","First view of the village"],tm:"15–20 min.",tx:"The ferry runs in time with the trains. In very cold weather it may change: check.",fa:"Toilets at the station.",st:"Hallstatt Bahnhof.",tp:"Ask about the ferry ticket on the train or at the pier.",lg:"Train from Salzburg about 2–2.5 h"}),
 S("g2","Hallstatt Marktplatz",47.56220,13.64930,"see","11:15","Free","m","The small main square with colourful houses, cafés and the lake behind. The picture-postcard spot.","Find the Trinity column in the middle of the square.",
   {i:["Market square with the Trinity column","Houses by the lake","Cafés and small shops"],tm:"45–60 min.",tx:"Free. Hallstatt is busy even in winter: go early.",fa:"Cafés, public toilets near the square.",st:"Ferry stop at the Markt.",tp:"Have lunch here or at the Seestraße lakeside."}),
 S("g3","Salzbergbahn funicular and Skywalk (Welterbeblick)",47.56280,13.65050,"view","13:00","Funicular ≈€16 adult · check family tickets","m","A funicular takes you up the hill to a viewing platform that hangs over the village and lake. Best on clear days.","Look straight down to the village roofs and the lake.",
   {i:["Funicular ride (Salzbergbahn)","Skywalk viewing platform","Path to the Salzwelten (salt mine)"],tm:"1–1.5 h.",tx:"Winter operation is limited: check salzwelten.at and the funicular timetable. Winter ice can close paths.",fa:"Toilets and café at the top.",st:"Valley station on the north side of the village, 10–15 min walk from the Markt.",tp:"If the weather is bad, skip the Skywalk and do the salt mine instead.",lg:"Walk about 10–15 min from the Markt"}),
 S("g4","Salzwelten Hallstatt (salt mine tour)",47.55930,13.64690,"play","14:15","≈€40 adult · child about half (check, combo with funicular)","g","A guided tour into the oldest salt mine in the world, with wooden slides and a salt lake. Fun for both kids.","Go down a miner’s slide and look for the underground salt lake.",
   {i:["Guided tour in a salt mine","Miners’ wooden slides","Underground salt lake","Mining history"],tm:"About 1.5 h.",tx:"Tour times and winter hours: check salzwelten.at. A minimum age may apply for some tours; for kids of 6 and 12 it is usually fine. Mine is cool (about 8 °C): dress in layers.",fa:"Cafés and toilets at the entrance.",st:"At the top of the funicular, a short walk.",tp:"Book a time slot online if possible."}),
 S("g5","Lakefront walk and Hallstatt Church",47.56100,13.64970,"view","16:00","Free","o","A calm walk on the lake path and a look at the small church with its frescoes. A quiet end to the day.","Look for the church on the cliff above the water.",
   {i:["Seestraße lakefront","Catholic parish church on the hill","Charnel house (Beinhaus) nearby"],tm:"30–40 min.",tx:"Free. The Beinhaus (bone house) is small and paid and may feel odd for a 6-year-old.",fa:"Cafés and toilets.",st:"Village on foot.",tp:"Leave by 16:30 to catch the ferry and return trains.",lg:"Short walk from the Markt"}),
 ],
 extras:[
 X("gx-museum","Hallstatt Museum",47.56180,13.64880,"see","Museum","≈€12 adult (check)","o","A small museum about 7,000 years of local history.","Look for the old tools and boats.",
   {i:["Local history","Prehistoric finds"],tm:"1 h.",tx:"Open daily in season; winter hours may be shorter: check hallstatt.net.",fa:"Toilets.",st:"Village centre.",tp:"A good rain option."}),
 X("gx-ischl","Bad Ischl (stop on the way)",47.71140,13.62060,"see","Town","Free","o","A spa town where Emperor Franz Joseph spent his summers. Pastries and a calm main street.","Look for the cake shops.",
   {cy:"Bad Ischl",i:["Zauner pastry shop","Old town and Kaiservilla outside"],tm:"1 h.",tx:"Free.",fa:"Cafés and toilets.",st:"Bad Ischl station.",tp:"Only if you travel by bus via Bad Ischl."}),
 X("gx-advent","Hallstatt Advent market (check dates)",47.56220,13.64930,"eat","Market","Free","o","A small Advent market in the village, usually on set days or weekends.","Look for the wooden stalls near the square.",
   {i:["Craft stalls","Warm drinks"],tm:"30 min.",tx:"Dates change every year: check hallstatt.net.",fa:"Toilets in cafés.",st:"Markt.",tp:"Bring cash."}),
 ]
},
{id:"d8",dow:"Sat",date:"5 Dec",title:"Train to Vienna and the Christmas lights",area:"Vienna, Old Town",cy:"Vienna",wxi:2,hc:"salzburg",sleep:"Vienna (near the Hauptbahnhof, Belvedere or Mariahilf)",
 start:"Salzburg Hauptbahnhof, direct train to Wien Hbf (about 2 h 20–2 h 30)",startPt:{n:"Salzburg Hauptbahnhof",lat:47.8130,lng:13.0457},
 budget:"€180",budgetNote:"Train Salzburg–Vienna for four from about €70 early, up to €150 later (check oebb.at) · dinner and market snacks ≈€60",
 clim:"Typical: about 0 to 5 °C. Sunset around 16:10.",
 lede:"A light transfer day. Take the direct train, check in, and spend the evening in central Vienna. St. Stephen’s, the Graben and the market at the City Hall are all in the middle of the old town.",
 getting:["Direct trains (Railjet) from Salzburg to Wien Hbf run about every 30 min and take 2 h 20–2 h 30. Reserve seats if you can.","Vienna’s U-Bahn, trams and buses are covered by Wiener Linien tickets: a 24 h, 48 h or 72 h pass is usually best.","On Sundays, public holidays and during Vienna school holidays, children aged 6–14 often ride Wiener Linien for free: check wienerlinien.at.","Today is the evening before Nikolaus (6 December): some places have Krampus parades. See Tips."],
 rain:["Stephansdom and the Haus der Musik are indoors.","Cafés on the Graben and Kohlmarkt are good rain stops.","The Rathaus market has covered areas and food stalls."],
 facts:["The roof of St. Stephen’s Cathedral is covered with about 230,000 glazed tiles in a zigzag pattern.","Demel is a pastry shop on the Kohlmarkt, open since 1786.","The Vienna Rathaus (City Hall) is in neo-Gothic style, with a big park lit up as a Christmas market."],
 spot:["Find the colourful tile roof of the cathedral","Spot a horse-drawn carriage (Fiaker)","Find the Pestsäule on the Graben","Look for the big Christmas tree at the City Hall"],
 wrule:"Transfer day. If it is raining, shorten the evening to the Rathaus market only.",
 stops:[
 S("h1","Stephansdom (St. Stephen’s Cathedral)",48.20860,16.37310,"see","15:30","Free · tower ≈€6–7 adult (check)","m","Vienna’s Gothic cathedral with a bright tile roof. The inside is dark and tall: free to enter.","Count the colours in the roof tiles.",
   {i:["Gothic interior","Tile roof (from outside)","South tower climb (paid)","Catacombs by tour (paid)"],tm:"30–45 min.",tx:"Free to enter. Tours and towers cost extra. Closed to tourists during services.",fa:"Toilets nearby.",st:"Stephansplatz: U1, U3.",tp:"Take the lift in the north tower if you want a view (check).",lg:"Train Salzburg to Vienna about 2 h 25"}),
 S("h2","Graben and the Pestsäule",48.20900,16.36980,"see","16:30","Free","g","The elegant pedestrian street with a baroque plague column. Lights hang over the street in Advent.","Look for the golden column with the saints.",
   {i:["Plague column (Pestsäule)","Shop windows and Christmas decorations"],tm:"20–30 min.",tx:"Free. Shops are open on Saturday until 18:00 or later.",fa:"Cafés and toilets in shops.",st:"Stephansplatz: U1, U3.",tp:"Walk with the kids on the inside of the street: it is crowded."}),
 S("h3","Kohlmarkt and Demel café",48.20950,16.36690,"eat","17:00","≈€10 per person for cake and chocolate","g","A luxury shopping street with the classic Demel pastry shop. Hot chocolate, cakes and the Hofburg at the end of the street.","Choose a cake in the glass counter and watch the pastry chefs.",
   {i:["Demel pastry shop","Hofburg view at the end of the street","Shop windows"],tm:"45–60 min.",tx:"Demel is open daily from about 09:00 to 19:00: check. Prices are high: share a cake.",fa:"Toilets in the café.",st:"Stephansplatz or Herrengasse.",tp:"Queue for the front café or sit in the back."}),
 S("h4","Wiener Christkindlmarkt am Rathausplatz",48.21070,16.35890,"eat","18:00","Free · dinner ≈€60","m","Vienna’s biggest Christmas market in front of the City Hall with lit trees, a children’s area and food stalls.","Walk through the park of lit-up trees and look for the children’s carousel.",
   {i:["Market stalls in front of the Rathaus","Children’s area with a carousel and workshops (check)","Illuminated trees in the Rathauspark","Food and Kinderpunsch"],tm:"1.5–2 h.",tx:"Usually open from mid-November to 26 December, daily from about 10:00 to 21:30: check christkindlmarkt.at.",fa:"Toilets near the market.",st:"Rathaus (U2) or Rathausplatz tram stop.",tp:"Mugs have a deposit. It is very busy on Saturday evening: hold hands and agree on a meeting point."}),
 ],
 extras:[
 X("hx-krampus","Krampus parade and Nikolaus traditions (evening of 5 Dec)",48.20860,16.37310,"see","Tradition","Free","o","On 5 December costumed devils (Krampus) appear in some towns and markets, often with a Krampus run. Impressive but may scare a 6-year-old.","Look from a distance and decide as a family.",
   {i:["Krampus runs in some places on the evening of 5 Dec","Nikolaus visits on 6 December"],tm:"As long as you like.",tx:"Dates and places change: check the event listings for Vienna.",fa:"Public toilets nearby.",st:"Varies.",tp:"If the little one is nervous, stay inside or go back early."}),
 X("hx-albertina","Albertinaplatz and the State Opera",48.20310,16.36910,"see","Walk","Free","o","Opera house and the square with a big view of the Albertina. A short walk from the Graben.","Look for the golden letters on the opera front.",
   {i:["State Opera (outside)","Albertina terrace"],tm:"20 min.",tx:"Free.",fa:"Cafés.",st:"Karlsplatz or Stephansplatz.",tp:"Easy walk back to Karlsplatz."}),
 X("hx-hofburg","Hofburg and Heldenplatz",48.20630,16.36500,"see","Palace","Courtyards free","o","The former imperial palace. Courtyards are free; museums inside are paid.","Look for the huge palace gate.",
   {i:["Courtyards","Statues of princes","Palace gate"],tm:"30 min.",tx:"Free to walk in. Museums have separate tickets.",fa:"Cafés nearby.",st:"Herrengasse or Volkstheater.",tp:"Good for a rain-free pause under the arches."}),
 ]
},
{id:"d9",dow:"Sun",date:"6 Dec",title:"Schönbrunn palace and zoo",area:"Vienna, Schönbrunn and Prater",cy:"Vienna",wxi:2,hc:"vienna",sleep:"Vienna",
 start:"Your hotel in Vienna, U4 to Schönbrunn (about 20 min)",startPt:{n:"Wien Hauptbahnhof",lat:48.1853,lng:16.3770},
 budget:"€260",budgetNote:"Schönbrunn palace tour ≈€26–30 adult, child about half (check) · Tiergarten Schönbrunn ≈€25 adult, child about half (check) · Riesenrad ≈€15 adult, ≈€7 child (check) · food ≈€60",
 clim:"Typical: about 0 to 5 °C, cold and grey. Sunset around 16:05.",
 lede:"Vienna’s imperial day, kid-friendly. The palace in the morning, the oldest zoo in the world, the Christmas market in front of the palace, and an optional ride on the Riesenrad in the evening. It is Sunday: shops are closed, but all of these are open.",
 getting:["Hotel or Hbf to Schönbrunn: U4 to Schönbrunn station (about 15–20 min).","From Schönbrunn to the Prater: U4 to Karlsplatz, then U1 to Praterstern (about 30 min).","Today is a Sunday: children aged 6–14 often ride Wiener Linien free (check wienerlinien.at).","Buy palace tickets online for a timed slot to skip the queue."],
 rain:["Palace tour and the Haus des Meeres (aquarium) are indoors.","Tiergarten has covered houses and a warm tropical hall.","The Naturhistorisches Museum (natural history) is open on Sundays: good for dinosaurs and gems."],
 facts:["Schönbrunn Palace has 1,441 rooms. Only some are open to visitors.","Tiergarten Schönbrunn was founded in 1752 and is considered the oldest zoo in the world still running.","The Wiener Riesenrad (Ferris wheel) was built in 1897 and is one of the oldest in the world."],
 spot:["Find a giant panda or a polar bear (check the zoo plan)","Count the windows of the palace front","Find the Gloriette on the hill","Spot Vienna from the Riesenrad"],
 wrule:"Mostly indoors + outdoors mix. If it pours, spend the afternoon at the Haus des Meeres or the Naturhistorisches Museum and skip the Prater.",
 stops:[
 S("i1","Schönbrunn Palace",48.18450,16.31220,"see","09:30","≈€26–30 adult · child about half (check)","m","The summer palace of the Habsburg emperors. A guided or audio tour through grand rooms where Empress Sisi and Franz Joseph lived.","Look for the room with all the mirrors and gold.",
   {i:["Imperial Tour (about 22 rooms) or Grand Tour (about 40 rooms)","Audio guide with a kids’ version","Palace courtyard and gardens"],tm:"1.5–2 h.",tx:"Open daily in winter from about 09:00 to 17:00. Buy a timed ticket online: check schoenbrunn.at. Cameras and photography rules apply inside.",fa:"Cafés, toilets, lockers.",st:"U4 Schönbrunn.",tp:"Pick the shorter Imperial Tour for kids."}),
 S("i2","Tiergarten Schönbrunn (zoo)",48.18160,16.30400,"play","12:30","≈€25 adult · ≈€13 child (check)","m","The oldest zoo in the world, in the palace park. Pandas, polar bears, elephants and a tropical house.","Find the pandas and the polar bear.",
   {i:["Giant pandas","Polar bears and elephants","Tropical rainforest house","Aquarium and terrarium"],tm:"2–2.5 h.",tx:"Open daily from about 09:00 to 16:30 in December: check zoovienna.at. Under 6 free; 6 and over pay a child ticket.",fa:"Cafés, toilets, play areas.",st:"Palace gate to the zoo (about 10 min walk inside the park).",tp:"Check the feeding times at the entrance."}),
 S("i3","Schönbrunn Christmas Market",48.18550,16.31150,"eat","15:30","Free · snacks ≈€40","g","A Christmas market in front of the palace, with a big tree, crafts, food stalls and a kids’ area.","Look for the stalls with wooden toys and ornaments.",
   {i:["Market in front of the palace","Crafts and gifts","Food stalls and Kinderpunsch","Children’s activities (check)"],tm:"1 h.",tx:"Usually open from about the third week of November to 26 December, daily from about 10:00 to 21:00: check weihnachtsmarkt.schoenbrunn.at.",fa:"Toilets at the market.",st:"U4 Schönbrunn.",tp:"Mugs have a deposit. The market is lit best after 16:00."}),
 S("i4","Prater and Wiener Riesenrad",48.21660,16.39590,"play","17:30","≈€15 adult · ≈€7 child (check)","g","The historic Ferris wheel in the Prater amusement park, lit at night. A ride gives a view of the city lights.","Look for the red cabins and the lit-up city.",
   {i:["Riesenrad ride (about 12 min)","Amusement park (some rides closed in winter)","Prater park walk"],tm:"1–1.5 h.",tx:"Riesenrad is open daily until about 20:00–21:00 in winter: check wienerriesenrad.com. Some Prater rides are closed in winter.",fa:"Cafés and toilets in the park.",st:"U1 Praterstern, 5–10 min walk.",tp:"Skip if the kids are tired.",lg:"U4 and U1 about 30 min"}),
 ],
 extras:[
 X("ix-gloriette","Gloriette and the Schönbrunn hill",48.17880,16.30420,"view","Viewpoint","Free (terrace ≈€4)","o","A colonnade on the hill behind the palace with a view over the park and the city. A short but uphill walk.","Look back down at the palace from the top.",

    var b=el("button","achip"+(t[0]==="all"?" grp":""),(t[2]?'<i style="background:'+t[2]+'"></i>':'')+t[1]);b.setAttribute("aria-pressed",String(fRate===t[0]));
    b.addEventListener("click",function(){fRate=t[0];sitClose(true);renderSChips();sitDraw(true);if(screen==="day")renderDay()});w2.appendChild(b)})}
function renderSit(){
  sitInit();renderSChips();updLoc();
  requestAnimationFrame(function(){if(!smap)return;smap.invalidateSize();sitClose(true);sitDraw(true)})}
$("sfit").addEventListener("click",function(){if(smap){sitClose(true);sitDraw(true)}});
/* ---------- detail ---------- */
function fact(l,t){return t?'<div class="fact"><b>'+l+'</b><span>'+t+'</span></div>':''}
function openDetail(s){
  var f=s.f||{},d=DAYS[s.day],box=$("detail"),r=rateOf(s);
  var h='<div class="dbar k-'+s.k+'"><button class="rb" id="d-x" aria-label="Back">‹</button><div class="dt"><span class="tg">'+d.dow+' · '+(s.x?s.cat:KIND[s.k]+" · "+s.t)+'</span><span class="nm">'+esc(s.n)+'</span></div><button class="chk" id="d-chk" aria-label="Visited" aria-pressed="'+(store.done[s.id]?"true":"false")+'">✓</button></div><div class="dbody"><div class="card2"><div class="facts"><div><span class="rtg r-'+r+'">'+RL[r]+'</span></div><div><b style="font-size:1.1rem">'+esc(s.c)+'</b></div><div>'+esc(s.why)+'</div>';
  if(f.i)h+='<div class="fact"><b>Inside / what to see</b><ol class="ins">'+f.i.map(function(t){return"<li>"+t+"</li>"}).join("")+'</ol></div>';
  h+=fact("Time needed · best time",f.tm)+fact("Tickets & rules",f.tx)+fact("Nearby facilities",f.fa)+fact("Nearest station or stop",f.st)+fact("Local tip",f.tp);
  h+='<details class="kd"><summary>For kids</summary><p>'+esc(s.kid)+'</p></details></div>';
  h+='<div class="btnrow"><a class="btn solid wide" href="'+mapsPlace(s)+'" target="_blank" rel="noopener">Open in Maps ↗</a><button class="btn wide" id="d-map">Show on map</button></div>';
  if(hasMe())h+='<div class="btnrow"><a class="btn wide" href="'+mapsDir(store.me,s,"walking")+'" target="_blank" rel="noopener">Walk from me ↗</a><a class="btn wide" href="'+mapsDir(store.me,s,"transit")+'" target="_blank" rel="noopener">Transit from me ↗</a></div>';
  h+='</div></div>';
  box.innerHTML=h;box.hidden=false;box.scrollTop=0;
  $("d-x").addEventListener("click",closeDetail);
  $("d-chk").addEventListener("click",function(){var v=!store.done[s.id];store.done[s.id]=v;save();$("d-chk").setAttribute("aria-pressed",v?"true":"false");if(screen==="day")renderDay();else sitDraw(false)});
  $("d-map").addEventListener("click",function(){closeDetail();go("sit");setTimeout(function(){sitCard(s)},120)})}
function closeDetail(){$("detail").hidden=true}
/* ---------- plan (days) ---------- */
function renderChips(){var w=$("chips2");if(!w)return;w.innerHTML="";DAYS.forEach(function(d,i){var x=wxDay(i);var b=el("button",null,"<b>Day "+(i+1)+" · "+d.dow+" "+d.date.split(" ")[0]+"</b><small>"+(x?wxIcon(x.code)+" "+x.hi+"° · ":"")+d.area.split(",")[0]+"</small>");b.setAttribute("aria-pressed",i===cur?"true":"false");b.addEventListener("click",function(){cur=i;store.day=i;save();renderDay()});w.appendChild(b)})}
function renderDay(){
  var d=DAYS[cur],box=$("s-day"),w=wxDay(cur);
  var h=pageHead("Day "+(cur+1),d.dow+" "+d.date+" · "+d.area)+'<div class="chips" id="chips2"></div>';
  h+='<div class="hero"><h2>'+d.title+'</h2><p>'+d.lede+'</p><div class="stats"><div class="stat"><b>'+d.stops.length+'</b><span>main stops</span></div><div class="stat"><b>'+d.extras.length+'</b><span>extras</span></div><div class="stat"><b>'+d.budget+'</b><span>est. cost</span></div></div><div class="cstat">'+d.budgetNote+'. For 2 adults and 2 children (6 and 12). Prices are estimates: check before you go.</div><div class="startline"><span class="k">Start</span><span>'+d.start+'</span></div><div class="startline"><span class="k">Sleep</span><span>'+d.sleep+'</span></div></div>';
  h+='<div class="panel"><b class="t">Weather</b>';
  if(w)h+='<div>'+wxIcon(w.code)+' <b>'+w.hi+'° / '+w.lo+'°</b> · rain chance '+(w.pp==null?"n/a":w.pp+"%")+(w.sun?' · sunset '+w.sun:'')+'</div>'+(w.pp>=50?'<div class="hrow"><b>Rain likely.</b> See "If it rains" below.</div>':'');
  else h+='<div class="hrow">'+d.clim+'</div><div class="hrow" style="color:var(--muted)">The live forecast appears here about two weeks before the trip. <a href="https://www.google.com/search?q=weather+'+encodeURIComponent(d.cy)+'" target="_blank" rel="noopener">Open forecast ↗</a></div>';
  h+='</div>';
  h+='<div class="panel"><b class="t">Getting around</b><ul>'+d.getting.map(function(r){return"<li>"+r+"</li>"}).join("")+'</ul></div>';
  if(d.wrule)h+='<div class="panel rain"><b class="t">Weather rule</b>'+d.wrule+'</div>';
  h+=hotelPanel(d);
  var cnt={m:0,g:0,o:0};d.stops.concat(d.extras).forEach(function(s){cnt[rateOf(s)]++});
  h+='<div class="sec"><h3>Rated places</h3><span>'+(d.stops.length+d.extras.length)+' places</span></div><div class="seg" id="rf" role="group" aria-label="Filter by rating"><button data-r="all">All</button><button data-r="m">Must see '+cnt.m+'</button><button data-r="g">Good '+cnt.g+'</button><button data-r="o">Optional '+cnt.o+'</button></div><div class="rkey"><b>Must see:</b> worth planning around. <b>Good to see:</b> nice if time allows. <b>Optional:</b> skip it and you miss nothing. Tap a tag on any place to change its rating.</div>';
  h+='<div class="sec"><h3>Main route</h3><span id="prog"></span></div><div class="bar"><i id="pbar"></i></div><div id="rows"></div>';
  h+='<div class="sec"><h3>More places</h3><span>'+d.extras.length+' places</span></div><div id="xrows"></div>';
  h+='<div class="panel rain"><b class="t">If it rains</b><ul>'+d.rain.map(function(r){return"<li>"+r+"</li>"}).join("")+'</ul></div>';
  h+='<details class="acc"><summary>For kids</summary><div class="c"><b>Facts</b><ul>'+d.facts.map(function(f){return"<li>"+f+"</li>"}).join("")+'</ul><b style="display:block;margin-top:10px">Spot list</b><ul class="spot" id="spot"></ul></div></details>';
  box.innerHTML=h;bindHotel();bindAa();renderChips();
  function prog(){var n=d.stops.filter(function(s){return store.done[s.id]}).length;$("prog").textContent=n+" of "+d.stops.length+" visited";$("pbar").style.width=(n/d.stops.length*100)+"%"}
  function ok(s){return fRate==="all"||rateOf(s)===fRate}
  function row(s,lab){var r=rateOf(s);var b=el("button","rowb k-"+s.k+(store.done[s.id]?" done":""),'<span class="num k-'+s.k+(s.x?" x":"")+'">'+lab+'</span><span class="rt"><b>'+esc(s.n)+'</b><small>'+(s.x?s.cat:KIND[s.k]+" · "+s.t)+' · '+esc(s.c)+'</small></span><span class="rtg r-'+r+'" role="button" tabindex="0">'+RL[r]+'</span>');
    b.addEventListener("click",function(e){var t=e.target.closest&&e.target.closest(".rtg");if(t){e.stopPropagation();var o=["m","g","o"];store.rate[s.id]=o[(o.indexOf(rateOf(s))+1)%3];save();renderDay();renderSChips();sitDraw(false);return}openDetail(s)});return b}
  d.stops.forEach(function(s,i){if(ok(s))$("rows").appendChild(row(s,String(i+1)))});
  d.extras.forEach(function(s){if(ok(s))$("xrows").appendChild(row(s,"+"))});
  if(!$("rows").children.length)$("rows").innerHTML='<p class="cstat">No main-route places with this rating.</p>';
  if(!$("xrows").children.length)$("xrows").innerHTML='<p class="cstat">No more places with this rating.</p>';
  Array.prototype.forEach.call(box.querySelectorAll("#rf button"),function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-r")===fRate));b.addEventListener("click",function(){fRate=b.getAttribute("data-r");renderDay();renderSChips();sitDraw(true)})});
  prog();
  var sp=$("spot");d.spot.forEach(function(t,i){var key=d.id+"_"+i;var li=el("li",null,'<label><input type="checkbox"'+(store.spot[key]?" checked":"")+'> <span>'+t+'</span></label>');li.querySelector("input").addEventListener("change",function(e){store.spot[key]=e.target.checked;save()});sp.appendChild(li)})}
/* ---------- tips ---------- */
function acc(t,html){return '<details class="acc"><summary>'+t+'</summary><div class="c">'+html+'</div></details>'}
function renderTips(){
  var h=pageHead("Tips","General advice, listed once. Prices and hours for each place are on the Plan tab.");
  h+=acc("Route and days at a glance",'<ul><li><b>Days 1–3 Munich:</b> arrival, family museum day, Zugspitze snow day.</li><li><b>Days 4–7 Salzburg:</b> old town, fortress, Kitzsteinhorn snow day, Hallstatt day trip.</li><li><b>Days 8–10 Vienna:</b> Christmas lights, Schönbrunn and zoo, relaxed departure day.</li><li>One big attraction per half day is enough. Christmas markets are for late afternoon and evening.</li></ul>');
  h+=acc("Weather and swapping days",'<ul><li><b>Clear mountain weather:</b> do the mountain day (Day 3 Zugspitze or Day 6 Kitzsteinhorn).</li><li><b>Cloud or storm in the mountains:</b> swap with a city day. Day 6 can swap with Day 5 (Salzburg) or Day 7 (Hallstatt).</li><li><b>Day 3 Zugspitze:</b> if it is cloudy, swap with Day 2 (Munich indoors) or use the Neuschwanstein alternative.</li><li>Hallstatt works on most days but is best with some visibility.</li><li>Check lift status and webcams in the morning: zugspitze.de and kitzsteinhorn.at.</li><li>Tap a rating tag on any place to change it between Must see, Good and Optional.</li></ul>');
  h+=acc("Tickets and transport",'<ul><li><b>Default:</b> public transport and walking. A rental car is only worth it for one specific day, and none of these days needs one.</li><li><b>Germany:</b> airport to Munich by S-Bahn (S1 or S8, about 40 min). In Munich ask for a group or Partner day ticket. A Bayern-Ticket (regional day pass for a small group, valid from 09:00 on weekdays) is usually the cheapest for Garmisch and Füssen. Check bahn.de and mvv-muenchen.de.</li><li><b>Munich to Salzburg and Salzburg to Vienna:</b> direct trains. Early online tickets (Sparschiene on oebb.at, Sparpreis on bahn.de) are the cheapest. Reserve seats on long trips.</li><li><b>Salzburg:</b> walk the old town. The Salzburg Card can cover the fortress, funicular, Haus der Natur and buses: compare it with single tickets (salzburg.info).</li><li><b>Vienna:</b> U-Bahn, trams and buses. A 24, 48 or 72 h pass is best. Children aged 6–14 often ride free on Sundays, holidays and school holidays: check wienerlinien.at. On Day 9 (a Sunday) this may apply.</li><li><b>Children:</b> under 6 usually ride free. Your 6-year-old usually needs a child ticket where the rule is ‘under 6 free’.</li></ul>');
  h+=acc("Christmas markets with kids",'<ul><li>Most markets run from mid or late November until 24–26 December. Check exact dates and hours before you go.</li><li>Go late afternoon to evening for the lights. Weekends are the busiest.</li><li><b>Kinderpunsch</b> is a warm fruit punch without alcohol. Mugs have a deposit (Pfand), around €3–5: return the mug to get the money back, or keep it as a souvenir.</li><li>Many stalls take cash only. Keep some euro notes.</li><li>Agree on a meeting point in the crowds, and hold the 6-year-old’s hand.</li></ul>');
  h+=acc("Krampus and Nikolaus",'<ul><li>On the evening of <b>5 December</b> (Day 8) there are Krampus runs: people dressed as devils with masks and bells in some towns and markets. On <b>6 December</b> (Day 9) is Nikolaus, with St. Nicholas visits and small gifts.</li><li>Krampus can scare young children. Watch from a distance, or skip it.</li></ul>');
  h+=acc("Sundays and opening days",'<ul><li><b>Sundays (Day 2 in Munich, Day 9 in Vienna):</b> most shops are closed. Museums, zoos, restaurants and Christmas markets are open.</li><li><b>Mondays:</b> some museums are closed. Day 3 (Monday) is a mountain day and Day 10 (Monday) is light.</li><li>Market stalls at the Viktualienmarkt close early on Saturday and are closed on Sunday.</li><li>Opening times change in winter: always check the official site on the day.</li></ul>');
  h+=acc("Winter clothes",'<ul><li><b>City days:</b> water-resistant winter jacket, sweater or fleece, warm trousers, winter shoes with good grip, warm socks, gloves, hat, scarf.</li><li><b>Mountain days (Zugspitze, Kitzsteinhorn):</b> thermal base layer, fleece, windproof insulated jacket, proper gloves, winter boots, warm trousers, sunglasses, sunscreen, neck warmer.</li><li><b>For the kids:</b> spare gloves and socks, a thermal layer, and a small snack.</li><li>Keep luggage light: you change hotels twice. Use hotel luggage storage or station lockers on transfer days.</li></ul>');
  h+=acc("Altitude and safety",'<ul><li>The Zugspitze (2,962 m) and the Kitzsteinhorn (3,029 m) are cold and windy. Kids can get tired or get a headache: drink water, go slowly and go down if needed.</li><li>Pavements and paths can be icy: wear shoes with grip.</li><li>Emergency: <b>112</b> (all of Europe), police 110 in Germany and 133 in Austria.</li><li>Keep bags closed in crowded markets and on trains.</li><li>Tap water is safe to drink in all three cities.</li></ul>');
  h+=acc("Food",'<ul><li><b>Easy kid food:</b> Brezel (pretzel), Käsespätzle (cheese noodles), Kaiserschmarrn (shredded pancake), Schnitzel, soup, Apfelstrudel.</li><li>Many sausage, meat and Glühwein stalls contain pork or alcohol. Ask <i>“Ohne Alkohol?”</i> or <i>“Ohne Schweinefleisch?”</i> if you need to. Döner, falafel, cheese and fish dishes are easy alternatives.</li><li>Restaurants often give a kids’ menu (Kinderteller). Tap water may be charged in restaurants.</li><li>Tipping: round up about 5–10% in restaurants.</li></ul>');
  h+=acc("Money and phone",'<ul><li>Currency is the euro in Germany and Austria. Cards are common, but small markets and some cafés prefer cash.</li><li>Get an eSIM or EU roaming SIM before you arrive. Download offline maps for the mountain days.</li><li>Check the ÖBB and DB apps for train times, and Google Maps for walking.</li></ul>');
  h+=acc("Useful German",'<ul><li>Hallo / Guten Tag / Grüß Gott: hello</li><li>Danke / Bitte: thanks / please</li><li>Eine Tageskarte für zwei Erwachsene und zwei Kinder, bitte: a day ticket for two adults and two children, please</li><li>Wo ist die Haltestelle / der Bahnsteig? Where is the stop / the platform?</li><li>Die Rechnung, bitte: the bill, please</li><li>Kinderpunsch, bitte: a children’s punch, please</li></ul>');
  h+='<p class="foot">Ticks, hotels, location and text size are saved on this device only. Prices, hours and train times are estimates and change: check the official sites before you go.</p>';
  $("s-tips").innerHTML=h;bindAa()}
/* ---------- navigation ---------- */
function go(s){screen=s;["sit","day","tips"].forEach(function(n){$("s-"+n).hidden=n!==s});
  document.body.classList.toggle("plan",s==="sit");
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabbar button"),function(b){if(b.getAttribute("data-s")===s)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  closeDetail();closeMenus();window.scrollTo({top:0});
  if(s==="sit")renderSit();if(s==="day")renderDay();if(s==="tips")renderTips()}
Array.prototype.forEach.call(document.querySelectorAll("nav.tabbar button"),function(b){b.addEventListener("click",function(){go(b.getAttribute("data-s"))})});
bindAa();
var h0=location.hash.replace("#","");go(["day","tips"].indexOf(h0)>-1?h0:"sit");
loadWx();
})();

</script>
</body></html>
