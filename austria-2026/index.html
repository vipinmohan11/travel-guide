*{box-sizing:border-box}

/* grouped lists */
.sech{margin:26px 20px 7px;font-size:.8125rem;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;gap:10px}
.sech .r{text-transform:none;letter-spacing:0;font-weight:400}
.foot{margin:7px 20px 0;font-size:.8125rem;color:var(--sub)}
.group{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--line)}
.row.tap{width:100%;border:0;background:none;text-align:left}
.row .grow{flex:1;min-width:0}
.k{color:var(--sub);font-size:.9375rem;flex:none;min-width:70px}
.v{flex:1;min-width:0;font-size:.9375rem}
.chev{width:16px;height:16px;stroke:var(--sub);opacity:.7}
.sm{font-size:.8125rem;color:var(--sub)}
.ttl{font-weight:600;font-size:1rem;line-height:1.25}

/* trip rows */
.dn{flex:none;width:34px;height:34px;border-radius:9px;background:var(--c);color:#fff;font-weight:700;font-size:1rem;display:grid;place-items:center}
.cnt{flex:none;font-size:.8125rem;font-weight:600;color:var(--accent)}
.how{margin:14px 16px 0;padding:16px;border-radius:12px;background:var(--accent-soft)}
.how b.h{display:block;font-size:1.0625rem;margin-bottom:10px}
.how ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.how li{display:flex;gap:12px;align-items:flex-start;font-size:.9375rem}
.how li i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-style:normal;font-weight:700;font-size:.8125rem;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:1rem;text-decoration:none}
.btn.solid{background:var(--accent);color:var(--on-accent)}
.btn.full{width:100%}
.btn.line{background:none;border:1.5px solid var(--accent)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.how .btn{margin-top:12px;min-height:40px}

/* segmented control */
.seg{display:flex;gap:2px;padding:2px;background:var(--fill);border-radius:9px}
.seg button{flex:1;min-height:32px;padding:0 4px;border:.5px solid transparent;border-radius:7px;background:none;font-weight:500;font-size:.8125rem;line-height:1.15}
.seg button small{display:block;font-size:.6875rem;color:var(--sub);font-weight:400}
.seg button[aria-pressed="true"]{background:var(--seg-on);border-color:var(--line);font-weight:600}
.segwrap{margin:14px 16px 0}
.segwrap .cap{font-size:.8125rem;color:var(--sub);margin:0 4px 6px}

/* tags */
.tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:.75rem;font-weight:600;line-height:1.5;white-space:nowrap}
.tag.m{background:var(--accent-soft);color:var(--accent)}
.tag.g{background:var(--fill);color:var(--fg)}
.tag.o{border:1px solid var(--line);color:var(--sub);line-height:1.35}
.tag.w{background:var(--warn-soft);color:var(--warn)}

/* place rows */
.pr{display:flex;align-items:center;gap:8px;padding:0 12px 0 0}
.pr+.pr::before{content:"";position:absolute}
.prow{position:relative;display:flex;align-items:center;gap:6px;padding:0 12px 0 0;min-height:68px}
.prow+.prow::before{content:"";position:absolute;top:0;left:56px;right:0;height:.5px;background:var(--line)}
.pmain{flex:1;min-width:0;display:flex;gap:12px;align-items:center;padding:10px 0 10px 16px;border:0;background:none;text-align:left}
.pn{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--c);color:var(--c);font-weight:700;font-size:.8125rem;display:grid;place-items:center}
.pn.x{width:28px;height:28px;border-width:1.5px;opacity:.9}
.pn .ic{width:15px;height:15px;stroke-width:2}
.pt{min-width:0}
.pt .nm{display:block;font-weight:600;font-size:1rem;line-height:1.25}
.pt .mt{display:block;color:var(--sub);font-size:.8125rem;margin-top:1px}
.pt .tg{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.add{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 12px 0 9px;border-radius:18px;border:1.5px solid var(--accent);background:none;color:var(--accent);font-weight:600;font-size:.875rem}
.add .ic{width:16px;height:16px;stroke-width:2.6}
.add.on{background:var(--accent);color:var(--on-accent)}

/* day info rows */
.callout{margin:12px 16px 0;padding:12px 14px;border-radius:12px;background:var(--fill);font-size:.9375rem}
.callout b{display:block;margin-bottom:2px;font-size:.8125rem;text-transform:uppercase;letter-spacing:.04em;color:var(--sub)}
.callout.w{background:var(--warn-soft)}
.callout.w b{color:var(--warn)}
ul.pl{margin:0;padding:0 16px 0 34px}
ul.pl li{margin:6px 0;font-size:.9375rem}
details.group>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 16px;font-weight:600;font-size:1rem;cursor:pointer}
details.group>summary::-webkit-details-marker{display:none}
details.group>summary::after{content:"";margin-left:auto;width:9px;height:9px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg);margin-top:-3px;flex:none}
details.group[open]>summary::after{transform:rotate(225deg);margin-top:3px}
details.group>.in{padding:2px 0 12px;border-top:.5px solid var(--line)}
details.group+details.group,.group+details.group,details.group+.group{margin-top:10px}
.spot{list-style:none;margin:0;padding:0 16px}
.spot label{display:flex;gap:12px;align-items:center;min-height:44px;font-size:.9375rem}
.spot input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.hform{padding:6px 16px 14px}
.hform input[type=text]{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:1rem}
.hform .btnrow{margin-top:8px}
.status{font-size:.8125rem;color:var(--sub);margin:6px 0 0;min-height:1.1em}

/* my list */
.ck{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--sub);background:none;display:grid;place-items:center;color:transparent}
.ck .ic{width:16px;height:16px;stroke-width:3}
.ck[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lrow{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;min-height:60px}
.lrow+.lrow::before{content:"";position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--line)}
.lrow.done .nm{text-decoration:line-through;color:var(--sub)}
.rm{flex:none;border:0;background:none;color:var(--sub);font-size:.8125rem;min-height:44px;padding:0 4px}
.empty{margin:28px 24px 0;text-align:center}
.empty svg{margin:0 auto 12px;width:56px;height:56px;stroke:var(--sub);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.empty p{margin:0 0 6px;color:var(--sub);font-size:.9375rem}
.empty b{display:block;font-size:1.25rem;margin-bottom:6px;color:var(--fg)}
.empty .btn{margin-top:12px}
.daych{margin:20px 20px 7px;font-size:.8125rem;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em}
.daych i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}

/* map view */
.mapbar{flex:none;background:var(--bar);border-bottom:.5px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}
.dpills{display:flex;gap:6px;margin-top:8px;align-items:center;overflow-x:auto;scrollbar-width:none}
.dpills::-webkit-scrollbar{display:none}
.dpills .lab{flex:none;font-size:.8125rem;color:var(--sub);margin-right:2px}
.dpills button{flex:none;min-width:40px;min-height:34px;padding:0 10px;border:1px solid var(--line);border-radius:17px;background:none;font-weight:600;font-size:.875rem}
.dpills button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.legend{display:flex;gap:16px;margin-top:8px;font-size:.75rem;color:var(--sub);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:50%;border:2px solid var(--sub);display:inline-block}
.legend i.f{background:var(--sub)}
.mapwrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:var(--bg)}
.mctl{position:absolute;z-index:500;right:10px;top:10px;display:grid;gap:8px}
.mctl button{width:44px;height:44px;border-radius:10px;border:.5px solid var(--line);background:var(--bar);display:grid;place-items:center;font-size:1.4rem;font-weight:500}
.mctl button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.sheet{position:absolute;z-index:520;left:0;right:0;bottom:0;background:var(--card);border-top:.5px solid var(--line);border-radius:14px 14px 0 0;padding:14px 16px 14px}
.sheet .top{display:flex;gap:10px;align-items:flex-start}
.sheet .nm{display:block;font-weight:700;font-size:1.0625rem;line-height:1.25}
.sheet .mt{display:block;font-size:.8125rem;color:var(--sub);margin-top:2px}
.sheet .x{flex:none;margin:-8px -8px 0 0;width:44px;height:44px;border:0;background:none;color:var(--sub)}
.sheet p{margin:8px 0 0;font-size:.875rem;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sheet .btnrow{margin-top:10px;flex-wrap:nowrap}
.sheet .btn{min-height:40px;padding:0 10px;font-size:.9375rem}
.sheet .add{min-height:40px;padding:0 14px 0 10px;flex:1.4;justify-content:center;font-size:.9375rem;border-radius:12px}
.pin{width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--c);color:var(--c);font:700 12px/25px var(--f);text-align:center;letter-spacing:-.03em}
.pin.in{background:var(--c);color:#fff}
.pin.sm{width:20px;height:20px;border-width:2px;font-size:0;line-height:15px}
.pin.dim{opacity:.38}
.pin.sel{outline:3px solid var(--fg);outline-offset:1px}
.hpin{width:28px;height:28px;border-radius:7px;background:#1c1c1e;color:#fff;border:2px solid #fff;font:700 13px/24px var(--f);text-align:center}
.medot{width:20px;height:20px;border-radius:50%;background:#0a84ff;border:3px solid #fff}
.pinw{background:none;border:0}
html[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9)}
.leaflet-container{font-family:var(--f);background:var(--bg)}
.leaflet-control-attribution{font-size:10px!important}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:600;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:flex;max-width:640px;margin:0 auto;height:var(--tab)}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.6875rem;font-weight:500;color:var(--sub);position:relative}
.tabbar button .ic{width:25px;height:25px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:.6875rem;font-weight:700;line-height:18px}

/* detail page */
.page{position:fixed;inset:0;z-index:800;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch}
.page .body{max-width:640px;margin:0 auto;padding:12px 0 calc(40px + env(safe-area-inset-bottom,0px))}
.fact{padding:10px 16px}
.fact+.fact{border-top:.5px solid var(--line)}
.fact b{display:block;font-size:.75rem;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.fact span,.fact ol{font-size:.9375rem}
.fact ol{margin:2px 0 0;padding-left:20px}
.pbody{padding:16px}
.pbody p{margin:8px 0 0;font-size:1rem}
.dtitle{margin:0;font-size:1.5rem;line-height:1.2;font-weight:700;letter-spacing:-.02em}
.tglist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.actions{margin:14px 16px 0;display:grid;gap:10px}

/* tips + settings */
.tips-p{margin:0;padding:6px 16px 0;font-size:.9375rem}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:36px;border:0;border-radius:9px;background:var(--fill);font-weight:600}
.dots{display:flex;gap:10px}
.dot{width:32px;height:32px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px var(--card)}
.dot[aria-pressed="true"]{border-color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px) + 14px);z-index:900;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9375rem;font-weight:500;max-width:88vw;text-align:center}
.wx{display:flex;align-items:center;gap:8px}
.wx .ic{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.flag{width:18px;height:12px;border-radius:2px;border:.5px solid rgba(0,0,0,.25);margin-right:6px;vertical-align:-1px;flex:none}
.mapbar .seg button{display:flex;flex-direction:row;align-items:center;justify-content:center}
svg.flag{display:inline-block;width:18px;height:12px;margin-right:4px}

.page .body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.dbar{position:fixed;left:0;right:0;bottom:0;z-index:810;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--line)}
.dn2{flex:1;min-width:0;display:flex;align-items:center;gap:6px;min-height:52px;padding:6px 10px;border:0;border-radius:12px;background:var(--fill,rgba(120,120,128,.12));color:var(--fg);text-align:left;font:inherit;font-size:.8125rem;font-weight:600}
.dn2.r{justify-content:flex-end;text-align:right}
.dn2 span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.dn2 small{display:block;font-weight:500;font-size:.6875rem;color:var(--sub)}
.dn2 .ic{flex:none;width:20px;height:20px;color:var(--accent)}
.dn2[disabled]{opacity:.35}

{id:"d3",dow:"Mon",date:"30 Nov",grp:"salzburg",wx:false,trans:"No long travel today: walk, funicular and a short bus if needed.",title:"Fortress, nature museum and hot chocolate",area:"Salzburg, Old Town and fortress",cy:"Salzburg",wxi:1,hc:"salzburg",sleep:"Salzburg",
 start:"Your hotel in Salzburg, walk to the Festungsbahn funicular at Kapitelplatz (about 20 min)",startPt:{n:"Salzburg Hauptbahnhof",lat:47.8130,lng:13.0457},
 budget:"€150",budgetNote:"Fortress with funicular ≈€17–20 adult, child 6–15 about half (check) · Haus der Natur ≈€14 adult, ≈€8 child (check) · food ≈€60",
 clim:"Plan for about 0–8 °C in the city. Sunset around 16:20: go up to the fortress in the morning.",
 lede:"The classic Salzburg day: fortress, Getreidegasse, Mozart and a family museum. This is also the bad-weather backup for the mountain day.",
 getting:["The Festungsbahn funicular leaves from Kapitelplatz and takes about 1 minute up the hill. Buy the combined fortress + funicular ticket.","The old town, Haus der Natur and Mirabell are all within 10–15 min walking of each other.","A local bus runs from the Hbf to the old town if the kids are tired.","Salzburg Card (24 h or more) can include the fortress, funicular and Haus der Natur: compare with single tickets."],
 rain:["Haus der Natur is a full indoor day with an aquarium and reptile zoo.","The fortress has indoor museums and a warm café.","Mozart’s Birthplace or the Salzburg Museum are further indoor options."],
 facts:["Hohensalzburg Fortress dates from 1077 and is one of the biggest fully preserved castles in Europe.","The Festungsbahn funicular opened in 1892 and is one of the oldest in Austria.","Haus der Natur has an aquarium, a reptile zoo and a space hall."],
 spot:["Find the fortress from three different places in the city","Spot a shark or a crocodile in Haus der Natur","Count the church towers from the fortress terrace","Taste Salzburger Nockerl or a hot chocolate"],
 wrule:"If Wednesday is clear and cold, this is also the best day for the fortress views. If Thursday’s mountain forecast is poor, swap Kaprun (Day 6) with this day only when the forecast for the Kitzsteinhorn is better here.",
 stops:[
S("e1","Hohensalzburg Fortress and the Festungsbahn",47.79500,13.04770,"play","09:45","Funicular + fortress ≈€17–20 adult (check) · child about half","m","The big medieval fortress above the city. Ride the funicular, walk the terraces for views and visit the small museums.","Look for the long Hohensalzburg walls and find the oldest cannon.",
   {i:["Funicular ride from Kapitelplatz","View terraces over the city and the Alps","Fortress museums and the Marionette museum","Café and shop inside"],tm:"2–2.5 h.",tx:"Open daily in winter, about 09:30–17:00. Tickets by the funicular: check festung-hohensalzburg.at. Audio guide available in English.",fa:"Cafés, toilets, lifts in part of the fortress.",st:"Kapitelplatz (Festungsbahn valley station).",tp:"Go early for clear views and fewer people. Part of the fortress is cobbled and uphill.",lg:"Walk from the hotel about 20 min to Kapitelplatz"}),S("d3","Getreidegasse",47.80020,13.04260,"see","11:45","Free · Mozartkugel ≈€1–2 each","m","The famous narrow shopping street with wrought-iron guild signs. The birthplace of Mozart is at number 9.","Find the iron signs, one for each shop.",
   {i:["Wrought-iron guild signs","Mozart’s Birthplace (optional)","Small shops and cafés"],tm:"30–45 min.",tx:"Free to walk. Many shops are open until 18:00–19:00.",fa:"Toilets in cafés.",st:"Old town on foot.",tp:"It is crowded at dusk: hold hands in the narrow passages."}),S("e5","Mozart’s Birthplace (Geburtshaus)",47.80040,13.04290,"see","12:30","≈€13 adult · check child price","g","The house where Mozart was born, with violins and family items. Short and warm.","Look for the tiny violin Mozart played as a child.",
   {i:["Mozart’s childhood violin","Family rooms and instruments"],tm:"45–60 min.",tx:"Open daily, about 09:00–17:30: check mozarteum.at. A Salzburg Card may cover it.",fa:"Toilets and shop.",st:"Getreidegasse 9.",tp:"Good for rain."}),S("e3","Haus der Natur",47.79930,13.03980,"play","14:00","≈€14 adult · ≈€8 child (check)","m","A natural history museum with an aquarium, reptile zoo, a space hall and science rooms. Great for both kids.","Spot a shark and a crocodile and find the space hall.",
   {i:["Aquarium with sharks and reef fish","Reptile zoo","Space hall and science centre","Dinosaurs and Alpine nature"],tm:"2–2.5 h.",tx:"Open daily about 09:00–17:00. Check hausdernatur.at for current prices and opening.",fa:"Café, toilets, lockers.",st:"Museumsplatz, a 10 min walk from the Getreidegasse.",tp:"The 12-year-old will like the space and science floors."}),S("e4","Café Tomaselli or another old-town café",47.79970,13.04370,"eat","16:00","≈€10 per person","g","A famous old coffee house on the Alter Markt. Time for hot chocolate and cake.","Order a hot chocolate and a slice of cake.",
   {i:["Hot chocolate and cakes","Salzburger Nockerl (a sweet soufflé, ask to share)","Old market square"],tm:"45 min.",tx:"Open daily from about 07:00 or 08:00 to 19:00 or 20:00: check.",fa:"Toilets inside.",st:"Alter Markt in the old town.",tp:"Any café on the Alter Markt works if it is full."}), ],
 extras:[
X("dx-cathedral","Salzburg Cathedral",47.79840,13.04690,"see","Church","Free","g","A huge baroque cathedral with a green dome and twin towers. The interior is calm and tall.","Look up at the big dome.",
   {i:["Dome and painted ceilings","Big organ","Domplatz square"],tm:"20–30 min.",tx:"Free. Closed to tourists during services.",fa:"Toilets nearby.",st:"Old town on foot.",tp:"Visit right before the market opens in the Domplatz."}),X("dx-peter","St. Peter’s Abbey and Cemetery",47.79570,13.04430,"see","Cemetery","Free","g","A small, peaceful old cemetery with iron crosses and tiny chapels, tucked below the cliff.","Look for the cave chapels in the rock.",
   {i:["Peterskirchhof cemetery with cave chapels","Church of St. Peter","The bakery and café in the old courtyard"],tm:"30–40 min.",tx:"Cemetery free. Catacombs have a small fee and tours at set times (check).",fa:"Toilets at the nearby café.",st:"Old town on foot.",tp:"Lunch at a simple café on the way."}),X("dx-mozartplatz","Mozartplatz and Residenzplatz",47.79830,13.04560,"see","Squares","Free","g","The squares between the cathedral and the river. Beautiful in the late afternoon light.","Look for the Mozart statue and the horse fountain.",
   {i:["Mozartplatz with the Mozart statue","Residenzplatz and fountain","View up to the Hohensalzburg Fortress"],tm:"30 min.",tx:"Free.",fa:"Cafés and public toilets on the squares.",st:"Rudolfskai / Salzburg Hbf buses to Mozartsteg.",tp:"Cross the river on the Mozartsteg footbridge for the best view."}),X("dx-sphaera","Kapitelplatz: golden ball and giant chess",47.79600,13.04790,"view","Walk","Free","o","A square below the fortress with a golden sphere statue and a giant chess board.","Look for the man standing on top of the golden ball.",
   {i:["Sphaera golden ball statue","Giant chess board","View up to the fortress"],tm:"15 min.",tx:"Free.",fa:"None.",st:"Old town on foot.",tp:"A quick stop on the way to the funicular tomorrow."}),X("ex-mozarthome","Mozart’s Residence",47.80270,13.04420,"see","Museum","≈€13 adult (check)","o","The family flat where Mozart lived from age 17. A quieter museum than the birthplace.","Find the piano in the family room.",
   {i:["Family flat rooms","Instruments"],tm:"1 h.",tx:"Open daily: check mozarteum.at.",fa:"Toilets and shop.",st:"Makartplatz.",tp:"Choose the birthplace OR the residence, not both."}), ]
},
{id:"d4",dow:"Tue",date:"1 Dec",grp:"salzburg",wx:true,trans:"Train Salzburg to Zell am See (about 1 h 20–1 h 40), then bus to the Kitzsteinhorn valley station. Last descent from the top is about 16:00–16:30.",title:"Kitzsteinhorn: snow, glacier and cable cars",area:"Kaprun, Kitzsteinhorn",cy:"Kaprun",wxi:1,hc:"salzburg",sleep:"Salzburg",
 start:"Salzburg Hbf, train to Zell am See, then bus to Kaprun and the Kitzsteinhorn valley station",startPt:{n:"Salzburg Hauptbahnhof",lat:47.8130,lng:13.0457},
 budget:"€320",budgetNote:"Top of Salzburg / Gipfelwelt 3000 ticket about €60–70 per adult and less for children (check kitzsteinhorn.at) · train and bus ≈€60–100 for four · food ≈€60",
 clim:"Salzburg: about 0–8 °C. At the top (3,000 m): around −5 to −10 °C or colder with wind. Sunset around 16:25.",
 lede:"The main high-Alpine snow experience of the trip. Cross by train to Zell am See, then ride the cable cars up the Kitzsteinhorn glacier to the ‘Top of Salzburg’ at 3,029 m. Move this day to the clearest weather of the week.",
 getting:["Salzburg Hbf to Zell am See: direct train, about 1 h 20–1 h 40 (book seats). Check oebb.at.","Zell am See to Kaprun and the Kitzsteinhorn valley station: regional bus (about 25–40 min). Buses are linked to winter ski traffic: check the timetable on the ÖBB app.","Gletscherbahn cable cars go from the valley station up the glacier to the Gipfelwelt 3000 platform. Last descent is around 16:00–16:30: leave the top by 15:00.","Return to Salzburg in the late afternoon: the last trains are fine, but darkness falls at 16:30."],
 rain:["If the summit is in cloud or the lifts are closed, skip the glacier. Do Salzburg city (Day 5 plan) instead.","Zell am See’s old town and the lake promenade are a gentle plan B.","Nothing here is an indoor day: keep this the one day that can move."],
 facts:["The Kitzsteinhorn is 3,203 m high. The Gipfelwelt 3000 viewing platform sits at 3,029 m and is called ‘Top of Salzburg’.","From the platform you can see over 30 peaks above 3,000 m, including the Grossglockner, Austria’s highest mountain.","Zell am See is a town on a lake that freezes at the edges in winter."],
 spot:["Find the Grossglockner on the panorama board","Spot a skier or a snowboarder from the cable car","Make a snow angel on the glacier","Count the cable car stations you pass"],
 wrule:"Mountain day. Check the Kitzsteinhorn webcam and lift status in the morning (kitzsteinhorn.at). If the top is in cloud, swap with Day 3 or Day 7 (Salzburg city days).",
 stops:[
S("f1","Zell am See",47.32500,12.79600,"see","09:15","Free","o","A small town on a lake in the Alps. Take a few minutes to see the water and the mountains before heading to the glacier.","Spot the big lake and the snow-capped mountains.",
   {cy:"Zell am See",i:["Station and lake promenade","Old town streets","Views of the Schmittenhöhe mountain"],tm:"20–30 min or a longer stop on the way back.",tx:"Free.",fa:"Cafés and toilets at the station and in town.",st:"Zell am See Bahnhof. Bus to Kaprun leaves near the station.",tp:"Buy water and snacks here.",lg:"Train from Salzburg Hbf about 1 h 20–1 h 40"}),S("f2","Kaprun village",47.27230,12.76370,"eat","10:00","Snacks ≈€8–12 per person","g","A small ski village with a medieval castle and cafés. A last stop for food before the mountain.","Look for the little castle on the hill.",
   {i:["Village centre","Kaprun Castle on the hill","Cafés and bakeries"],tm:"20–30 min.",tx:"Free.",fa:"Cafés, toilets, shops.",st:"Bus from Zell am See to Kaprun (Ortszentrum).",tp:"The Kitzsteinhorn bus may skip the village: check the timetable.",lg:"Bus from Zell am See about 15–25 min"}),S("f3","Kitzsteinhorn valley station (Gletscherbahn)",47.25820,12.73200,"play","10:45","Ticket ≈€60–70 adult (check) · less for kids","m","Where the glacier cable cars start. Buy the Gipfelwelt 3000 ticket here and ride up through the valley and onto the ice.","Ride the big cable car and watch the valley shrink.",
   {cy:"Kaprun",i:["Gletscherbahn cable cars","Mid-station views","Ski and snowboard areas at the glacier"],tm:"About 30–40 min of riding in total.",tx:"Open daily in the winter season. Prices change: check kitzsteinhorn.at. Children’s tickets depend on age; under 6 are often free, your 6-year-old may need a child ticket.",fa:"Restaurants, toilets and lockers at the valley station.",st:"Kitzsteinhorn Gletscherbahn stop (bus).",tp:"Rent nothing: you are not skiing. Wear boots, sunglasses and sunscreen.",lg:"Bus from Kaprun about 10–15 min"}),S("f4","Gipfelwelt 3000: Top of Salzburg",47.19680,12.69340,"view","12:00","Included in the cable car ticket","m","A viewing platform at 3,029 m with a panorama of 30 peaks, an ice cave and an exhibition about the glacier.","Look for the Grossglockner and find a spot with no wind.",
   {i:["Viewing platform at 3,029 m","Panorama board with named peaks","Ice palace / glacier exhibition (check)","Mountain restaurant"],tm:"1.5–2 h at the top.",tx:"Open daily in winter with the cable cars. Strong wind and cold: bring layers and neck warmers.",fa:"Restaurant, toilets, shop.",st:"Top of the Gletscherbahn.",tp:"Altitude can make kids tired or give a headache: drink water, walk slowly, and go down if needed."}),S("f5","Alpincenter and the glacier restaurants",47.21330,12.72060,"eat","14:00","Lunch ≈€60 for four","g","A mid-station with restaurants, snow slopes and a calm place for lunch before heading down.","Share a big bowl of Kaiserschmarrn (shredded pancake).",
   {i:["Self-service restaurants","Terrace with snow views","Snow play area (check)"],tm:"1 h.",tx:"Open with the cable cars. Prices at the glacier are high: bring snacks.",fa:"Toilets, lockers.",st:"Mid-station on the Gletscherbahn.",tp:"Be on the last descent by 15:30–16:00."}), ],
 extras:[
X("fx-zell","Zell am See lake promenade",47.32530,12.80000,"view","Walk","Free","o","A short evening walk on the lake after the mountain.","Look for ducks and swans near the shore.",
   {i:["Lake promenade","Town centre and cafés"],tm:"30–45 min.",tx:"Free.",fa:"Cafés and toilets.",st:"Zell am See station, 10 min walk.",tp:"Only if your train back is not too tight."}),X("fx-schmitten","Schmittenhöhe cable car (Zell am See)",47.32370,12.79860,"view","Cable car","≈€30 adult (check)","o","A lower-altitude cable car with views of the lake and the Alps. A cheaper alternative to the glacier.","Spot the lake from above.",
   {i:["Cable car ride","Mountain walks and views"],tm:"2–3 h.",tx:"Winter ski area: paths may be icy. Check schmitten.at.",fa:"Restaurants, toilets.",st:"Zell am See Schmittenhöhebahn, a 15 min walk from the station.",tp:"A good backup if the glacier is in cloud."}),X("fx-burg","Kaprun Castle",47.26930,12.75610,"see","Viewpoint","Free (outside)","o","A small castle above the village, mostly seen from outside.","Take a photo of the castle with snow.",
   {i:["Castle from outside","Village views"],tm:"20 min.",tx:"Interior mostly closed in winter.",fa:"Cafés in the village.",st:"Kaprun village.",tp:"Skip if you are short on time."}), ]

{id:"d5",dow:"Wed",date:"2 Dec",grp:"salzburg",wx:true,trans:"Salzburg Hbf to Hallstatt by train (usually via Attnang-Puchheim) and ferry, about 2.5–3 h each way. Or use a rental car for just this day if you do not want 2+ hours of travel (check the price).",title:"Hallstatt: the lake village",area:"Hallstatt, Salzkammergut",cy:"Hallstatt",wxi:1,hc:"salzburg",sleep:"Salzburg",
 start:"Salzburg Hbf, train via Attnang-Puchheim to Hallstatt station, then the ferry across the lake",startPt:{n:"Salzburg Hauptbahnhof",lat:47.8130,lng:13.0457},
 budget:"€230",budgetNote:"Train and ferry for four about €80–120 (check oebb.at) · salt mine tour and funicular ≈€100 for the family (check salzwelten.at) · food ≈€50",
 clim:"Plan for about 0–5 °C or colder, often fog or low cloud on the lake. Sunset around 16:15.",
 lede:"A classic Austrian lake-and-mountain village without changing hotels. The trip takes about 2.5 hours each way by train and ferry, so make it a full day.",
 getting:["Salzburg to Hallstatt: usually train to Attnang-Puchheim, change to the Salzkammergut line, get off at Hallstatt station. The ferry crosses the lake to the village and is timed to meet trains. About 2.5–3 h in total: check oebb.at and the ÖBB app.","Another route: train or bus to Bad Ischl, then local bus to Hallstatt.","The salt mine funicular (Salzbergbahn) goes from the village up to the Salzwelten and the Skywalk. Check opening and tours for winter.","Last return trains in winter are early evening: plan to leave the village by about 16:30."],
 rain:["The salt mine tour (Salzwelten) is partly underground: good in rain.","The Hallstatt Museum and cafés in the market square are dry options.","In fog the Skywalk shows nothing: keep it flexible and go on a clearer day if you can swap."],
 facts:["Hallstatt is a UNESCO World Heritage village. The salt mine above it is among the oldest in the world.","A copy of Hallstatt was built in China, in a village called Luoyuan.","The miners’ slides in the Salzwelten tour are real wooden slides used by workers to go down quickly."],
 spot:["Take the ferry across the lake","Find the old Lutheran church tower","Ride a miner’s slide (if on the tour)","Spot swans on the lake"],
 wrule:"Hallstatt works in most weather but is best with some visibility. If you can, do Kaprun on the clearest day and Hallstatt on another.",
 stops:[
S("g1","Hallstatt station and the ferry",47.56120,13.64090,"play","10:45","Ferry ≈€3–4 per adult (check)","g","A small station on the opposite shore of the lake. The ferry ride is the best arrival: you see the village from the water.","Count the swans and look for the village appearing.",
   {i:["Hallstatt Bahnhof","Short ferry ride across the Hallstätter See","First view of the village"],tm:"15–20 min.",tx:"The ferry runs in time with the trains. In very cold weather it may change: check.",fa:"Toilets at the station.",st:"Hallstatt Bahnhof.",tp:"Ask about the ferry ticket on the train or at the pier.",lg:"Train from Salzburg about 2–2.5 h"}),S("g2","Hallstatt Marktplatz",47.56220,13.64930,"see","11:15","Free","m","The small main square with colourful houses, cafés and the lake behind. The picture-postcard spot.","Find the Trinity column in the middle of the square.",
   {i:["Market square with the Trinity column","Houses by the lake","Cafés and small shops"],tm:"45–60 min.",tx:"Free. Hallstatt is busy even in winter: go early.",fa:"Cafés, public toilets near the square.",st:"Ferry stop at the Markt.",tp:"Have lunch here or at the Seestraße lakeside."}),S("g3","Salzbergbahn funicular and Skywalk (Welterbeblick)",47.56280,13.65050,"view","13:00","Funicular ≈€16 adult · check family tickets","m","A funicular takes you up the hill to a viewing platform that hangs over the village and lake. Best on clear days.","Look straight down to the village roofs and the lake.",

   "<b>SIM:</b> buy an eSIM online before you travel. There is no roaming within the EU, so one SIM works in Germany and Austria (Switzerland is not in the EU: check separately).",
   "<b>Passenger rights:</b> for long delays or cancellations of trains or flights you may get compensation, for flights up to about €600 in some cases. <a href=\"https://europa.eu/youreurope/citizens/travel/passenger-rights/index_en.htm\" target=\"_blank\" rel=\"noopener\">See the EU rules</a>.",
   "<b>Buses:</b> compare on <a href=\"https://www.busradar.com/\" target=\"_blank\" rel=\"noopener\">busradar.com</a>.",
   "<b>Power bank and EU plug adaptor:</b> pack both."]));
  h+=sec("Hotels",ul([
   "Stay near the <b>Hauptbahnhof</b> (Hbf = central railway station), for example München Hbf.",
   "Compare on Google Hotels first, then check Booking.com, Agoda or Airbnb for the booking. Airbnb is strong in Europe.",
   "Check <b>breakfast</b>: many places do not include it and few restaurants open early.",
   "Before booking, open Google Maps and check how easy the hotel is to reach by train, tram and bus.",
   "Munich is one of the most expensive cities in Germany."]));
  h+=sec("Trains, tickets and transport",ul([
   "Public transport is usually much cheaper and easier than taxis. Munich Airport to the city: about €15 by train, €80 or more by taxi.",
   "Do not rent a car for the whole trip. A car only helps if you do not want 2+ hours of travel to Hallstatt.",
   "Take <b>day tickets</b> in each city: unlimited trains, trams and buses. Children usually travel free or reduced. In Germany children under 15 travel free on DB trains with a parent: say so when you buy the ticket.",
   "Single tickets must be <b>validated before the journey</b>. App tickets from DB or ÖBB are already valid.",
   "Reserve seats on long trains (Munich to Salzburg, Salzburg to Vienna)."]));
  h+='<div class="sech"><span>Eating out and money</span></div>';
  h+=sec("Restaurants: the unwritten rules",ul([
   "Do not trust Google reviews in Germany: bad ratings are often removed after legal threats. Use Reddit or forums.",
   "Ask the waiter “Do you have a table for two?” even if the place is empty. Do not just sit down.",
   "You order drinks first, then food. Water is often more expensive than beer, and there is no free tap water. Sparkling water is the default: ask for “still”.",
   "Food takes time. Once served, the waiter will not come back. Make eye contact instead of raising your hand.",
   "The bill is only brought if you ask. They will not rush you to leave. Many places ask about drinks at the end: that is not free.",
   "At payment they ask “Zusammen oder getrennt?” (together or separately). Say “Zusammen” for together.",
   "Tip is not expected, but people leave 5–10%. Example: a bill of €46.87, pay €50."]));
  h+=sec("Cash, cards and bottle deposits",ul([
   "Use a credit card or a card like Wise and enable it for Europe. Some small restaurants accept only cash: look at the glass door or ask before you sit.",
   "<b>Christmas market stalls often take cash only.</b> Carry some €5 and €10 notes.",
   "Shop bottles have a deposit (<b>Pfand</b>) of €0.08–0.25 that you get back when you return the bottle. A cola at €0.80 costs €1.05 at the till.",
   "Market mugs also have a deposit (around €3–5)."]));
  h+=sec("Opening times, water and toilets",ul([
   "Most shops close by 20:00 and are <b>closed on Sundays</b>. Restaurants and supermarkets are the exception.",
   "Public toilets usually cost €0.50–1.50. Restaurants have free toilets if you eat there.",
   "A glass of water in a restaurant can cost around €3. Bring a thermal flask: hotels will fill it with hot water."]));
  h+='<div class="sech"><span>On the trip</span></div>';
  h+=sec("Weather and clothes",ul([
   "Plan for about 4–8 °C or lower in Munich, Salzburg and Vienna, and 0–5 °C or lower in Hallstatt. Nights are often below zero. On mountain tops it can be −5 to −10 °C or colder. Snow in the cities is not expected.",
   "Expect clouds and wind. City forecasts are accurate in apps like The Weather Channel or AccuWeather; mountain forecasts are less so.",
   "<b>Must have:</b> water-resistant, windproof winter jacket · fleece or sweater · warm trousers or thermal leggings (useful for the younger child) · scarf · beanie covering the ears · warm socks · gloves · waterproof shoes (not sneakers) · light day backpack.",
   "<b>For children:</b> spare socks and gloves in the day bag, thermal layers on cold days.",
   "<b>Mountain days:</b> sunglasses, sunscreen, neck warmer. Proper layering matters more than the brand. No need for expensive gear."]));
  h+=sec("Christmas markets with children",ul([
   "Most markets run from mid or late November to 24–26 December. Check exact dates and hours.",
   "Go late afternoon to evening for the lights. Weekends are the busiest.",
   "<b>Kinderpunsch</b> is a warm fruit punch without alcohol. Many stalls sell alcohol: ask “Ohne Alkohol?” for the kids.",
   "<b>Pork:</b> sausages, Leberkäse, soups, dumplings and many fillings are <b>possibly made with pork</b>. Look for “Schwein” or “Speck” on the menu, or ask “Ist da Schweinefleisch drin?” (is there pork in it?). Safe choices are usually cheese, pretzels, potato dishes, fish or vegetarian stalls.",
   "Agree on a meeting point in the crowds and hold the 6-year-old’s hand."]));
  h+=sec("Krampus and Nikolaus",ul([
   "On the evening of <b>5 December</b> (Day 8) some towns have Krampus runs: people dressed as devils with masks and bells. On <b>6 December</b> (Day 9) is Nikolaus, with St. Nicholas visits.",
   "Krampus can scare young children: watch from a distance or skip it."]));
  h+=sec("Mountain days and swapping days",ul([
   "Do the mountain day (Kitzsteinhorn, Day 4) on a clear day. If it is cloudy, swap with a Salzburg city day (Day 3 or Day 7).",
   "Check the lift status and webcam in the morning: kitzsteinhorn.at.",
   "At 3,000 m kids can feel tired or get a headache: drink water, go slowly, go down if needed.",
   "Paths and pavements can be icy: wear shoes with grip."]));
  h+=sec("Useful German",ul([
   "Hallo / Guten Tag / Grüß Gott: hello","Danke / Bitte: thanks / please","Haben Sie einen Tisch für vier? Do you have a table for four?","Eine Tageskarte für zwei Erwachsene und zwei Kinder, bitte: a day ticket for two adults and two children, please","Zusammen, bitte: together, please (paying)","Die Rechnung, bitte: the bill, please","Kinderpunsch, bitte: a children’s punch, please","Ist da Schweinefleisch drin? Is there pork in it?","Ohne Schweinefleisch, bitte: without pork, please","Stilles Wasser, bitte: still water, please"]));
  h+='<p class="foot">Emergency: 112 (all of Europe). Prices, hours and train times are estimates and change: check the official sites before you go.</p>';
  return h}

function render(keepScroll){
  var y=window.pageYOffset;
  VIEWS.forEach(function(v){var e=$("v-"+v);if(e)e.hidden=(v!==view)});
  document.querySelectorAll(".tabbar button").forEach(function(b){if(b.getAttribute("data-s")===TABOF[view])b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  var n=totalList(),bd=$("tabbadge");bd.textContent=n;bd.hidden=!n;
  if(view==="map"){document.body.style.paddingBottom="0";mapShow();return}
  document.body.style.paddingBottom="";
  var el=$("v-"+view);
  el.innerHTML=view==="trip"?vTrip():view==="day"?vDay():view==="list"?vList():vTips();
  if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0)}
function parseHash(){
  var h=(location.hash||"").replace("#","");var m=h.match(/^day-(\d+)$/);
  if(m&&DAYS[+m[1]-1]){view="day";cur=+m[1]-1;mapCity=DAYS[cur].grp;mapDay="all"}else if(["trip","map","list","tips"].indexOf(h)>-1)view=h;else view="trip"}
function go(hash){if(location.hash==="#"+hash){parseHash();render();return}location.hash=hash}
window.addEventListener("hashchange",function(){closeDetail(true);parseHash();render()});
window.addEventListener("popstate",function(){if(!$("detail").hidden&&!(history.state&&history.state.detail))closeDetail(true)});

/* ---------- actions ---------- */
function toggleAdd(id){var on=!store.list[id];if(on)store.list[id]=true;else{delete store.list[id];delete store.done[id]}save();toast(on?"Added to My list":"Removed from My list");refresh()}
function refresh(){
  if(view==="map"){drawMap(false);if(selId)openSheet(selId);var n=totalList(),bd=$("tabbadge");bd.textContent=n;bd.hidden=!n}else render(true);
  if(!$("detail").hidden&&detailId)openDetail(detailId)}
function parseHotel(raw){
  var s=(raw||"").trim(),m;if(!s)return{err:"Paste a Google Maps link or two numbers (lat, lng), or use GPS."};
  if(/^https?:\/\//i.test(s)){
    if(/maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs/i.test(s))return{err:"Short Google links cannot be opened here. Open it in your browser, copy the long address and paste that."};
    var u=s;try{u=decodeURIComponent(s)}catch(e){}
    m=u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||u.match(/[?&](?:q|query|ll|destination|daddr)=(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
    if(m)return{lat:+m[1],lng:+m[2]};return{err:"No location found in that link."}}
  m=s.match(/^(-?\d+\.\d+)\s*[, ]\s*(-?\d+\.\d+)$/);if(m)return{lat:+m[1],lng:+m[2]};
  return{err:"Use a Google Maps link or two numbers like 48.14, 11.56."}}
function gps(cb){if(!navigator.geolocation){toast("GPS is not available here");return}toast("Finding you…");navigator.geolocation.getCurrentPosition(function(p){cb({lat:p.coords.latitude,lng:p.coords.longitude})},function(){toast("Could not get your location. Allow location access.")},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
function copyList(){
  var t="My Munich, Salzburg and Vienna list\n";
  DAYS.forEach(function(d){var items=d.stops.concat(d.extras).filter(inList);if(!items.length)return;t+="\n"+dlabel(d)+"\n";items.forEach(function(s){t+="- "+s.n+(s.t?" ("+s.t+")":"")+"\n"})});
  if(navigator.share){navigator.share({text:t}).catch(function(){})}
  else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("List copied")},function(){toast("Could not copy")})}
  else toast("Copy is not available here")}

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t)return;var a=t.getAttribute("data-act"),id=t.getAttribute("data-id");
  switch(a){
   case"add":e.stopPropagation();toggleAdd(id);break;
   case"place":openDetail(id);break;
   case"detailx":closeDetail();break;
   case"dnav":{var ci=dctx.indexOf(detailId),n=dctx[ci+ +t.getAttribute("data-d")];if(n)openDetail(n,true);break}
   case"day":{var i=+t.getAttribute("data-i");if(DAYS[i])go("day-"+(i+1));break}
   case"tab":go(t.getAttribute("data-s"));break;
   case"hidehow":store.hideHow=true;save();render(true);break;
   case"settings":go("tips");break;
   case"done":store.done[id]=!store.done[id];save();refresh();break;
   case"addmust":ALL.forEach(function(s){if(s.r==="m"&&!s.x)store.list[s.id]=true;});save();toast("Added all Must see places");render();break;
   case"copy":copyList();break;
   case"daymap":mapCity=DAYS[cur].grp;mapDay=cur;selId=null;go("map");break;
   case"showmap":{var s=P[id];closeDetail();mapCity=s.city;mapDay=s.day;selId=id;go("map");break}
   case"mapcity":mapCity=t.getAttribute("data-c");mapDay="all";selId=null;mapShow();break;
   case"mapday":{var d=t.getAttribute("data-d");mapDay=d==="all"?"all":+d;selId=null;mapShow();break}
   case"zin":if(map)map.zoomIn();break;case"zout":if(map)map.zoomOut();break;
   case"sheetx":closeSheet();break;
   case"locate":if(store.me&&store.meOn!==false){store.meOn=false;save();drawMap(false);t.setAttribute("aria-pressed","false")}else gps(function(g){store.me=g;store.meOn=true;save();t.setAttribute("aria-pressed","true");drawMap(false);if(map)map.setView([g.lat,g.lng],15)});break;
   case"hotel-edit":hotelEdit=t.getAttribute("data-c");render(true);break;
   case"hotel-clear":delete store.hotels[t.getAttribute("data-c")];save();hotelEdit=t.getAttribute("data-c");render(true);break;
   case"hotel-save":{var r=parseHotel($("hin").value);if(r.err){$("hmsg").textContent=r.err;break}store.hotels[t.getAttribute("data-c")]=r;save();hotelEdit=null;render(true);break}
   case"hotel-gps":{var c=t.getAttribute("data-c");gps(function(g){store.hotels[c]={lat:g.lat,lng:g.lng};save();hotelEdit=null;render(true)});break}
   case"install":if(deferredInstall){deferredInstall.prompt();deferredInstall=null}break;
   case"theme":store.theme=t.getAttribute("data-t");save();applyAll();render(true);break;
   case"fs":FS+=+t.getAttribute("data-d");store.fs=FS;save();applyAll();render(true);break;
   case"accent":store.accent=t.getAttribute("data-a");save();applyAll();render(true);break;
  }});
document.addEventListener("change",function(e){var t=e.target;if(t.getAttribute&&t.getAttribute("data-act")==="spot"){store.spot[t.getAttribute("data-k")]=t.checked;save()}});

(function(){var x0=0,y0=0;var dt=$("detail");dt.addEventListener("touchstart",function(e){var t=e.touches[0];x0=t.clientX;y0=t.clientY},{passive:true});dt.addEventListener("touchend",function(e){var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;if(Math.abs(dx)>80&&Math.abs(dy)<45){var ci=dctx.indexOf(detailId),n=dctx[ci+(dx<0?1:-1)];if(n)openDetail(n,true)}},{passive:true})})();
parseHash();render();loadWx();
})();
