 {id:"conesa",n:"Conesa Entrepans (lunch)",lat:41.3829,lng:2.1775,k:"eat",t:"13:00",c:"~€5 per sandwich",why:"Toasted sandwiches since 1951 with 90+ fillings, on Plaça Sant Jaume.",kid:"Ham-and-cheese toastie is a safe pick.",tip:"Order at the counter, eat on the square."},

{id:"d3",dow:"Wed",date:"21 Oct",title:"Park Güell, Bunkers & Gràcia",area:"Gràcia",start:"Metro Vallcarca (L3), then outdoor escalators up",budget:"€128",budgetNote:"€49.50 Park Güell (2×€18 + child €13.50) · ~€8 transport · ~€70 food",
 lede:"Hill day with the best views in the city. Wear good shoes: steep first, then downhill.",

 {id:"guell",n:"Park Güell Monumental Zone",lat:41.4145,lng:2.1527,k:"see",t:"10:30 slot",c:"€18 adult · €13.50 child 7–12",why:"The mosaic salamander, the wavy bench terrace and the gingerbread gatehouses.",kid:"Count the columns in the Hypostyle Room (there are 86).",tip:"Book on parkguell.barcelona. Arrive no more than 30 min late or the ticket is void."},

 {id:"vila",n:"Plaça de la Vila de Gràcia",lat:41.4026,lng:2.1570,k:"play",t:"16:45",c:"Free",why:"Village square with a tall clock tower. Gràcia used to be its own town.",kid:"Local kids play football and ride scooters here.",tip:"Benches for a break."},
 {id:"sol",n:"Plaça del Sol",lat:41.4012,lng:2.1576,k:"play",t:"17:15",c:"Free",why:"The liveliest square in Gràcia, full of families in the early evening.",kid:"Space to run around.",tip:"Ice cream shops nearby."},
 {id:"virreina",n:"Plaça de la Virreina",lat:41.4036,lng:2.1611,k:"see",t:"18:00",c:"Free",why:"Quiet square with a pretty church. Locals' favourite.",kid:"Listen for the church bell.",tip:"Sunset is around 18:45."},
 {id:"tapeo",n:"Tapeo Gràcia (dinner)",lat:41.4031,lng:2.1597,k:"eat",t:"evening",c:"Tapas ~€5–12 each",why:"Neighbourhood tapas: ham croquettes, bombas, cod fritters.",kid:"Patatas bravas and croquetas are kid-proof.",tip:"Carrer Topazi 8. Check opening time; book if you can."}],
 extras:[

 {id:"x-putxet",n:"Jardins del Turó del Putxet",lat:41.4087,lng:2.1420,k:"view",cat:"Viewpoint",c:"Free",why:"Quiet hilltop park with a playground and a city view, mostly used by locals.",kid:"Playground at the top.",tip:"Good alternative if Park Güell's free zone is crowded."},

 rain:["Swap with Thursday (CosmoCaixa).","Casa Vicens interior (paid).","Gràcia's covered market, Mercat de l'Abaceria."],

{id:"d4",dow:"Thu",date:"22 Oct",title:"Science, Parks & a Free Museum Hour",area:"Sarrià & Ciutadella",start:"FGC L7 Av. Tibidabo, then 15 min walk (or bus V15)",budget:"€113",budgetNote:"€16 CosmoCaixa (under 16 free) · Picasso free slot · ~€12 transport · ~€85 food",
 lede:"An indoor rainforest in the morning, a giant mammoth in the afternoon, and Picasso for free on Thursday.",
 stops:[

 {id:"arc",n:"Arc de Triomf",lat:41.3910,lng:2.1806,k:"see",t:"14:30",c:"Free",why:"Red-brick arch built for the 1888 World Fair. Wide promenade for scooters and street music.",kid:"Race to the arch from the far end.",tip:"Metro L1 Arc de Triomf."},
 {id:"cascada",n:"Cascada fountain (Ciutadella)",lat:41.3897,lng:2.1871,k:"see",t:"15:00",c:"Free",why:"A grand fountain with golden horses. Climb the stairs behind it.",kid:"A young Gaudí helped build this as a student.",tip:"Ciutadella Park has clean grass for a rest."},
 {id:"lake",n:"Ciutadella boating lake",lat:41.3884,lng:2.1857,k:"play",t:"15:30",c:"Rowing boat small fee",why:"Rent a rowing boat for half an hour.",kid:"Let the child row. It's harder than it looks!",tip:"Boats may close early in autumn; check on the day."},

 {id:"paradeta",n:"La Paradeta Born (dinner)",lat:41.3862,lng:2.1838,k:"eat",t:"evening",c:"Pay by weight, ~€15–20 pp",why:"Pick your seafood at the counter, they cook it, you collect when your number is called.",kid:"Choosing the fish is part of the fun. Fried calamari is a safe bet.",tip:"Carrer Comercial 7. Queue forms early; go at opening."}],
 extras:[
 {id:"x-umbracle",n:"Umbracle & Hivernacle (Ciutadella)",lat:41.3880,lng:2.1853,k:"see",cat:"Hidden gem",c:"Free to see from outside",why:"Two 19th-century iron-and-glass plant houses inside the park.",kid:"A shady house made of wooden slats for plants.",tip:"Near the park's Passeig de Picasso side."},
 {id:"x-zoo",n:"Barcelona Zoo",lat:41.3870,lng:2.1910,k:"play",cat:"Kid fun",c:"Paid · ~€21 adult, ~€12.50 child",why:"Big zoo inside Ciutadella Park, with a children's farm.",kid:"Elephants, gorillas and a petting farm.",tip:"Only if you skip CosmoCaixa or have a spare morning."},
 {id:"x-sjoan",n:"Passeig de Sant Joan",lat:41.3940,lng:2.1755,k:"play",cat:"Kid fun",c:"Free",why:"Wide boulevard with playgrounds every block, popular with local families.",kid:"Playground hopping up the avenue.",tip:"Watch for the bike lane in the middle."},
 {id:"x-tamarita",n:"Jardins de la Tamarita",lat:41.4122,lng:2.1340,k:"play",cat:"Hidden gem",c:"Free",why:"Small leafy garden near CosmoCaixa with a play area, quiet and local.",kid:"A calm run-around after the museum.",tip:"2 min from CosmoCaixa."}],

 extras:[

 {id:"m1",n:"Plaça de Santa Maria",lat:41.5931,lng:1.8372,k:"see",t:"10:00",c:"Free",why:"The main square in front of the monastery, under the rock needles. You arrive here from the rack railway or cable car.",kid:"The rocks look like a giant's saw. Find five shapes in them.",tip:"Get here before 11:00 to miss the tour buses."},
 {id:"m2",n:"Funicular de Sant Joan",lat:41.6008,lng:1.8295,k:"view",t:"10:30–11:45",c:"Paid, check turistren.cat",why:"A short funicular up the mountain to a viewpoint high above the monastery. Wide views over Catalonia, and on clear days the Pyrenees.",kid:"Look back down at the tiny monastery and the rack railway line.",tip:"Check it is running on turistren.cat. Take a jacket: it is colder up here."},
 {id:"m3",n:"Basilica & Black Madonna",lat:41.5937,lng:1.8366,k:"see",t:"12:00",c:"Basilica free · Madonna viewed by timed slot",h:"Basilica 7:30–20:00 · Madonna 8:00–10:30 and 12:00–18:25",why:"A 12th-century wooden statue, the Black Madonna (La Moreneta), sits above the altar. Visitors queue to touch her hand. On Sundays the Escolania boys' choir sings at 12:00 (not in school holidays).",kid:"The choir is made of boys aged 9 to 14. Listen for the highest voices.",tip:"Check the Madonna slots and the choir on montserratvisita.com. Cover shoulders and knees."},
 {id:"m4",n:"La Cafeteria (self-service)",lat:41.5936,lng:1.8361,k:"eat",t:"13:15",c:"~€12 per adult",h:"Weekends 8:45–18:30",why:"Self-service canteen with hot meals, open all year. Quick and cheaper than the restaurants.",kid:"Simple plates: pasta, chicken, chips.",tip:"Bring water and snacks from Barcelona: there are no water points on the trails."},
 {id:"m5",n:"Camí dels Degotalls",lat:41.5963,lng:1.8417,k:"play",t:"14:30–15:45",c:"Free",why:"An easy path along the cliff to the Degotalls rock wall, where climbers hang. About 50 min, with views of the needles all the way.",kid:"Count the climbers on the wall. Turn back whenever you want.",tip:"Sturdy shoes. The path is rocky. Turn back by 16:00 to catch the train."}],
 extras:[
 {id:"x-mmuseu",n:"Museu de Montserrat",lat:41.5933,lng:1.8363,k:"see",cat:"Museum",c:"€7 adult · €4 child",why:"Art museum with paintings by Picasso, Dalí and Monet, and an archaeology section.",kid:"Look for the old objects from Egypt and the Holy Land.",tip:"Good indoor stop in bad weather."},
 {id:"x-rosari",n:"Path of the Rosary to Santa Cova",lat:41.5944,lng:1.8283,k:"see",cat:"Walk",c:"Free",why:"A stone path with sculptures leading down to the Santa Cova chapel. About 1 h there and back.",kid:"Each sculpture group tells a story: count them.",tip:"The Santa Cova funicular was closed for maintenance. Walk instead."},
 {id:"x-jeroni",n:"Sant Jeroni summit",lat:41.6058,lng:1.8112,k:"view",cat:"Hard hike",c:"Free",why:"The highest point (1,236 m). About 2 h from Sant Joan, rated challenging.",kid:"Not advised with a child unless you hike regularly.",tip:"Skip it on a short day."}],
 rain:["Basilica, museum and the choir are all indoors.","Fog is common: the view can be white. The monastery still works.","If it is stormy, take the next train down. Swap with Tuesday's Tarragona."],
 facts:["Montserrat means 'serrated mountain' in Catalan.","The highest point, Sant Jeroni, is 1,236 m.","The Black Madonna statue is about 900 years old."],
 spot:["A rock that looks like a face or animal","The rack railway or a cable car","A monk or a choir boy","A climber on the rock wall","A mountain goat"]},
{id:"d8",reg:true,jt:"1 h 20",loc:"Girona",dow:"Mon",date:"26 Oct",title:"Girona: river houses & old walls",area:"Girona",start:"Barcelona Sants, R11 to Girona (about 1 h 20) or Avant (38 min)",startPt:{n:"Barcelona Sants station",lat:41.3791,lng:2.1400},back:"Girona station to Barcelona Sants (R11 or Avant)",budget:"€115",budgetNote:"R11 about €10 each way per adult (Avant €15–30) · cathedral combined ticket €12 · ~€45 food",
 lede:"A medieval city with colourful houses on the river, a cathedral with a famous staircase and walls you can walk on. Compact and flat enough for kids.",
 wxNote:"Forecast shown is for Barcelona. Girona is inland: usually a few degrees cooler in the morning.",
 getting:["R11 (Regional) from Sants: about 1 h 20, around €10 each way per adult. Avant: 38 min, separate ticket €15–30, best booked a few days ahead on renfe.com.","Girona station to the old town: 10–12 min on foot.","R11 was disrupted by storm damage in early October. Check rodalies.gencat.cat the evening before.","Check the last train back before lunch. Avant has more evening trains."],
 stops:[
 {id:"g1",n:"Casas de l'Onyar & Eiffel bridge",lat:41.9852,lng:2.8238,k:"view",t:"10:30",c:"Free",why:"Houses in yellow, red and ochre hang over the River Onyar. The red iron bridge (Pont de les Peixateries Velles) was built in 1877 by Eiffel's firm.",kid:"Count the colours of the houses. Look for laundry lines.",tip:"The east side is in sun before about 13:00. Best photo is from Pont de Sant Agustí."},
 {id:"g2",n:"Girona Cathedral steps",lat:41.9879,lng:2.8267,k:"see",t:"11:15",c:"Combined ticket €12 (cathedral, Sant Feliu, art museum)",why:"A wide Baroque staircase of 90 steps leads to the cathedral. It played the Great Sept of Baelor in Game of Thrones. Inside: one of the widest Gothic naves in the world.",kid:"Climb the 90 steps and count them.",tip:"Buy tickets on the cathedral's official site. Avoid the café terraces on the steps: they are pricey."},
 {id:"g3",n:"El Call (Jewish quarter)",lat:41.9885,lng:2.8275,k:"see",t:"12:30",c:"Streets free · museum €4",why:"Narrow stone lanes and steps of the old Jewish quarter. The Jewish History Museum is on Carrer de la Força 8.",kid:"Find the narrowest lane. Try to touch both walls.",tip:"Wear comfortable shoes: the stone is uneven."},
 {id:"g4",n:"Passeig de la Muralla (city walls)",lat:41.9897,lng:2.8290,k:"play",t:"13:30",c:"Free",why:"Walk on the medieval walls above the city. Good views over rooftops and the cathedral tower.",kid:"Find the towers and look for the highest roof.",tip:"Some stairs are steep. It is a good place for a short rest with a view."},
 {id:"g5",n:"Plaça de la Independència (lunch)",lat:41.9836,lng:2.8227,k:"eat",t:"14:45",c:"~€14 per adult",why:"Arcaded square with many restaurants. The Rambla de la Llibertat and the lanes by Carrer Ballesteries have cheaper menus.",kid:"Pasta, croquettes, pizza and ice cream are easy.",tip:"Look for a menú del dia on weekdays. It is cheaper than à la carte."}],
 extras:[
 {id:"x-banys",n:"Banys Àrabs (Arab Baths)",lat:41.9873,lng:2.8280,k:"see",cat:"Hidden gem",c:"€3",h:"10:00–18:00 Mon–Sat",why:"A 12th-century bath house in Romanesque style, with a domed room and a small pool.",kid:"Look at the light coming through the dome.",tip:"A 5 min walk from the cathedral."},
 {id:"x-cinema",n:"Museu del Cinema",lat:41.9856,lng:2.8246,k:"play",cat:"Kid fun",c:"€5",why:"Magic lanterns, shadow puppets and early cameras, with hands-on exhibits.",kid:"Try the optical toys.",tip:"Check opening days on the museum site: some museums close on Mondays."},
 {id:"x-pvi",n:"Plaça del Vi",lat:41.9868,lng:2.8255,k:"see",cat:"Square",c:"Free",why:"The town-hall square, with cafés and a small market on some days.",kid:"Look for the town-hall clock.",tip:"A good stop on the way between the river and the cathedral."}],
 rain:["Cathedral, Sant Feliu and the Art Museum are all indoors (combined ticket).","Museu del Cinema (€5) is a great rainy-day stop.","Arab Baths for a short indoor visit."],
 facts:["The cathedral steps appeared in Game of Thrones, season 6.","Eiffel's company built the red bridge in 1877.","El Call is the old Jewish quarter, with narrow lanes and stone steps."],
 spot:["A red iron bridge","A house with green shutters","A 90-step staircase","A tower on the wall","A cat on a doorstep"]},
{id:"d9",reg:true,jt:"1 h 15",loc:"Tarragona",dow:"Tue",date:"27 Oct",title:"Tarragona: Roman city by the sea",area:"Tarragona",start:"Barcelona Sants, Regional train to Tarragona (60–75 min)",startPt:{n:"Barcelona Sants station",lat:41.3791,lng:2.1400},back:"Tarragona station to Barcelona Sants (Regional)",budget:"€105",budgetNote:"Train about €10 return per adult · Roman sites: single €5 or joint €15 per adult, child under 12 free · ~€45 food",
 lede:"A Roman amphitheatre right on the beach, a chariot circus and a sea balcony. The sites are compact and mostly walkable.",
 wxNote:"Forecast shown is for Barcelona. Tarragona is similar, a bit milder on the coast.",
 getting:["Take a Regional or Media Distancia train from Sants: 60–75 min, about €8–10 return per adult. Do not take the Avant: it stops at Camp de Tarragona, 12–15 km from the city.","Tarragona station is by the sea. The amphitheatre is 15–20 min on foot.","Roman sites on winter hours from today: Amphitheatre Tue–Fri 9:00–18:30, Circus-Pretorium 9:00–20:00. Last entry 30 min before closing. They are closed on Mondays.","Check rodalies.gencat.cat for works on the Tarragona line before you go."],
 stops:[
 {id:"t1",n:"Balcó del Mediterrani",lat:41.1147,lng:1.2588,k:"view",t:"10:30",c:"Free",why:"A balcony at the end of Rambla Nova with a view over the sea, the beach and the Roman amphitheatre.",kid:"Rub the railing like everyone does for luck. Spot ships in the port.",tip:"Look down: you can see the amphitheatre arena."},
 {id:"t2",n:"Roman Amphitheatre",lat:41.1143,lng:1.2607,k:"see",t:"10:45–12:00",c:"€5 adult · under 12 free",h:"Tue–Fri 9:00–18:30",why:"A Roman arena built on the shore, where gladiators fought. There are ruins of a Visigothic church in the middle.",kid:"Stand in the arena and imagine 14,000 people cheering.",tip:"The joint ticket (€15) covers five Roman sites: worth it if you do three or more."},
 {id:"t3",n:"Platja del Miracle",lat:41.1138,lng:1.2625,k:"play",t:"12:15",c:"Free",why:"The city beach right next to the amphitheatre. Even in October it is good for a walk, shells and a sea breeze.",kid:"Collect shells. The sea is cold: paddling only.",tip:"Beach cafés may be closed out of season."},
 {id:"t4",n:"Roman Circus & Pretorium",lat:41.1176,lng:1.2595,k:"see",t:"13:15–14:30",c:"€5 adult · under 12 free",h:"Tue–Fri 9:00–20:00",why:"Stone vaults of the chariot-racing circus, and the Pretorium tower with a view over the old town and the sea.",kid:"Walk the dark vaults like a gladiator. Climb the tower.",tip:"Part of the joint ticket. Allow 1 h 15."},
 {id:"t5",n:"Plaça de la Font (lunch)",lat:41.1186,lng:1.2571,k:"eat",t:"14:45",c:"~€14 per adult",why:"An old-town square with restaurants and tapas bars. Menu of the day is cheapest at weekday lunch.",kid:"Fried seafood, croquettes, pizza.",tip:"Order the menú del dia. Many places stop kitchen service around 15:30."}],
 extras:[
 {id:"x-tcat",n:"Tarragona Cathedral",lat:41.1190,lng:1.2584,k:"see",cat:"Church",c:"Paid, check at the door",why:"A Romanesque-Gothic cathedral with a peaceful cloister.",kid:"Look for the large rose window.",tip:"Next to Plaça de la Font."},
 {id:"x-tpas",n:"Passeig Arqueològic (Roman walls)",lat:41.1197,lng:1.2566,k:"see",cat:"Walk",c:"€5 adult · under 12 free",why:"A walk along the old Roman and medieval walls, with towers and gardens.",kid:"Count the cannons.",tip:"Part of the joint ticket."},
 {id:"x-ferreres",n:"Pont del Diable aqueduct",lat:41.1366,lng:1.2310,k:"see",cat:"Free sight",c:"Free",why:"A two-level Roman aqueduct in a pine valley, outside the city. Needs a local bus or taxi, about 20 min.",kid:"Walk the path beside it.",tip:"Only if you have energy left. Check buses before you go."}],
 rain:["The Circus-Pretorium vaults are covered.","Tarragona Cathedral and its cloister.","The Roman museum (MNAT) on Plaça del Rei: check hours."],
 facts:["Tarragona was the Roman city of Tarraco, over 2,000 years old.","The amphitheatre was built right on the beach.","The Roman circus was used for chariot races."],
 spot:["A Roman arch","A lizard on a wall","The sea from the balcony","A church inside an arena","A fishing boat"]},
{id:"d10",reg:true,jt:"1 h 20",loc:"Tossa de Mar",dow:"Wed",date:"28 Oct",title:"Costa Brava: Tossa de Mar",area:"Tossa de Mar",start:"Barcelona Estació d'Autobusos Nord, Sarfa bus to Tossa de Mar (about 1 h 20)",startPt:{n:"Estació d'Autobusos Barcelona Nord",lat:41.3955,lng:2.1803},back:"Sarfa bus from Tossa de Mar to Barcelona Nord",budget:"€110",budgetNote:"Bus about €14–15 each way per adult (check the child fare) · walls free · ~€50 food",
 lede:"The Costa Brava ('wild coast') with a walled medieval town on a rock above the bay. Beach, towers, lighthouse and a coastal path.",
 wxNote:"Forecast shown is for Barcelona. The coast can be windier. Bring a jacket.",
 getting:["Sarfa bus from Barcelona Nord (next to Arc de Triomf metro, L1) to Tossa de Mar: about 1 h 20, around €14–15 each way per adult. Buy on sarfa.com and check the child fare and the last bus back.","Tossa bus station to the beach: about 10–15 min on foot.","There is no direct train to Tossa. Do not plan this day around Rodalies.","In late October the sea is cold and some seaside cafés close. Bring layers."],
 stops:[
 {id:"c1",n:"Platja Gran",lat:41.7192,lng:2.9323,k:"play",t:"10:45",c:"Free",why:"The main beach, with the old walled town rising at the end. Good for a walk, even in October.",kid:"Look for the shapes of the towers above you.",tip:"The sea is cold. Dry sand play is fine."},
 {id:"c2",n:"Vila Vella (walled old town)",lat:41.7213,lng:2.9346,k:"see",t:"11:30–12:45",c:"Free to walk the walls",why:"A 12th- to 14th-century walled town on a headland, with cobbled lanes, towers and sea views. One of the best-preserved walled medieval towns on the Catalan coast.",kid:"Find a tower, then find the biggest wall. Look for the statue of a woman looking out to sea.",tip:"Wear shoes with grip: the stone is smooth."},
 {id:"c3",n:"Far de Tossa (lighthouse)",lat:41.7220,lng:2.9369,k:"view",t:"12:45",c:"Free",why:"The lighthouse at the end of the headland, with the best view over the bay and cliffs.",kid:"Look for sea birds on the rocks.",tip:"Hold hands near the edges."},
 {id:"c4",n:"Seafront lunch (Passeig del Mar)",lat:41.7197,lng:2.9318,k:"eat",t:"13:30",c:"~€15 per adult",why:"Restaurants along the beach front with fish, rice and menús. Many close or have limited hours out of season.",kid:"Grilled fish, fried squid, pasta.",tip:"Ask for the menú del dia. A cheaper option: bakery sandwiches on the beach."},
 {id:"c5",n:"Mar Menuda",lat:41.7216,lng:2.9321,k:"play",t:"15:00",c:"Free",why:"A small, quiet cove just north-west of the old town. Rocks, clear water and a calm end to the day.",kid:"Look for crabs and small fish in the rocks.",tip:"Head to the bus station by about 16:30 for the evening bus."}],
 extras:[
 {id:"x-ronda",n:"Camí de Ronda (coastal path)",lat:41.7283,lng:2.9421,k:"view",cat:"Walk",c:"Free",why:"A footpath along cliffs and small coves north of the town. Steps and slopes, with sea views.",kid:"Find a hidden cove.",tip:"Only if the weather is clear. Good shoes."},
 {id:"x-tmuseu",n:"Museu Municipal de Tossa",lat:41.7213,lng:2.9347,k:"see",cat:"Museum",c:"Paid, check at the door",why:"Local museum inside the old town, with local art and history, including a painting by Chagall.",kid:"Look for the Chagall painting.",tip:"A good wet-weather stop."}],
 rain:["Museu Municipal in the old town.","Bakeries and cafés in the lanes.","If the sea is rough, switch to Sitges: R2 Sud from Sants or Passeig de Gràcia, about 40 min, with a beach, old town and museums."],
 facts:["Costa Brava means 'wild coast'.","The walled old town, the Vila Vella, dates from the 12th to 14th centuries.","Hollywood actress Ava Gardner filmed here in 1950: there's a statue of her."],
 spot:["A round tower on the wall","A lighthouse","A fishing boat on the sand","A statue of Ava Gardner","A cove with clear water"]}

function km(a,b){var r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2);return 12742*Math.asin(Math.sqrt(x))}
function walk(a,b){return km(a,b)*1.3}
function mins(k){return Math.max(1,Math.round(k/4.3*60))}
function fmtKm(k){return k<1?Math.round(k*100)*10+" m":k.toFixed(1)+" km"}
function q(n,c){return encodeURIComponent(n.replace(/\s*\(.*?\)/g,"")+", "+(c||"Barcelona"))}

/* ================= TIPS (general advice, said once) ================= */
function renderTips(){
  function acc(t,body,open){return '<details class="acc"'+(open?" open":"")+'><summary>'+t+'</summary><div class="c">'+body+'</div></details>'}
  $("s-tips").innerHTML=pageHead("Tips","General advice, listed once. Bookings and prices are on each day.")+
  acc("Getting around",'<ul><li><b>T-casual</b>: €13 for 10 rides in zone 1. Each ride allows changes within 75 minutes on metro, bus, tram, FGC and local trains. One card can be shared by the whole family: validate it once per person.</li><li>Children aged 4 and over pay a full fare.</li><li>Google Maps shows live metro and bus times. Use the Transit links in this app for each leg.</li><li>The metro runs roughly 5:00–24:00 (later on Fridays, all night on Saturdays). Check the TMB app for changes.</li><li><b>Airport:</b> the R2 Nord train from Terminal 2 accepts the T-casual. The L9 airport metro does not (€5.90 airport ticket). From T1, take the free shuttle bus to T2.</li><li>Hola Barcelona unlimited card (from €18.70 for 2 days) pays off only if you ride a lot.</li></ul>',true)+
  acc("Money",'<ul><li>Lunch is the cheap meal: <b>menú del día</b> is three courses for about €13–18 on weekdays.</li><li>Spanish meal times: lunch 13:30–15:30, dinner from 20:30. Kitchens often close in between.</li><li>Supermarkets (Mercadona, Bonpreu, Condis) are good for picnics and water.</li><li>Walk one street back from La Rambla and the seafront for normal prices.</li><li>When paying by card, always choose <b>EUR</b>.</li><li>Tipping is optional: rounding up is enough.</li><li>The tourist tax doubled in April 2026. It is usually paid at the hotel, per person per night.</li></ul>')+
  acc("Safety",'<ul><li><b>Pickpockets</b> are the main risk on La Rambla, metros L1 and L3, around Sagrada Família, on beaches and in crowds. Wear bags in front, zipped, and keep phones off café tables.</li><li>Common tricks: a "spill" on your clothes, petition clipboards, friendship bracelets, a map held over your bag.</li><li><b>Emergency: 112</b> (any phone, English spoken).</li><li>Agree a meeting point each day. Keep a card with a parent\'s number in your child\'s pocket.</li><li>Bike lanes often run along pavements, especially on the seafront and Passeig de Sant Joan.</li><li>October sun is still strong. Take a hat, sunscreen and a refillable bottle; public fountains have drinking water.</li></ul>')+
  acc("Regional day trips (25–28 Oct)",'<ul><li><b>Tickets:</b> the T-casual works only inside Barcelona zone 1. Rodalies, FGC to Montserrat and Sarfa buses need their own tickets. Buy at the station or on fgc.cat, renfe.com and sarfa.com.</li><li><b>Check the line the evening before:</b> rodalies.gencat.cat shows works and strikes. R11 and R2 Nord had storm disruption in early October.</li><li><b>Clocks go back 1 hour on Sunday 25 Oct at 03:00.</b> Phones update automatically.</li><li><b>Last trains:</b> check the return before lunch. Montserrat\'s last rack train down is 18:41.</li><li><b>Swap idea:</b> Sitges (R2 Sud, about 40 min from Sants or Passeig de Gràcia) is an easy beach-town swap for any trip.</li><li>Bring water, snacks, a jacket and a charged phone: regional stops are quieter and smaller.</li></ul>')+
  '<p class="foot">Prices checked October 2026. Hours and prices can change: check official sites the day before. Ticks, hotel, location and text size are saved on this device only.</p>';bindAa()}

  closeDetail();closeMenus();window.scrollTo({top:0});
